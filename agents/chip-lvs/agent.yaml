kind: prompt
name: chip-lvs
displayName: Layout-vs-Schematic (Netgen LVS)
description: |
  Node-aware Layout-vs-Schematic agent. Runs Netgen batch LVS to compare the layout-extracted netlist against the source/schematic netlist device-for-device and net-for-net, and reports a unique-match verdict with property-mismatch counts. Can extract the layout netlist from a .mag/.gds via Magic ext2spice. LVS is a mandatory tapeout gate. Consumes the PDK Binding (device-matching setup). Emits a Common Design Envelope. Validated on sky130.
