name: plip
description: "Detect and characterize non-covalent protein-ligand interactions (hydrogen bonds, hydrophobic contacts, pi-stacking, salt bridges) from complex structures."
version: 1.0.0
category: Structural Biology
license: GPL-2.0
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/plip:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: profile_interactions
    description: "Profile non-covalent interactions in each protein-ligand complex PDB."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action profile_interactions --input {{input_directory}} --output {{output_directory}}"
