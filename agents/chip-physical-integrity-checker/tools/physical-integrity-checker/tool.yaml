name: physical-integrity-checker
description: |
  Aggregates physical-signoff reports/metrics and performs deterministic OpenROAD, OpenDB, and netlist checks where inputs permit. Emits per-check verdicts and total critical violations in a fail-closed Common Design Envelope.
version: 1.0.1
category: Chip Design
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-physical-integrity-checker:1.0.1'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 10Gi
      gpu: 0
    max_resources:
      cpu: 2
      ram: 4Gi
      storage: 60Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Run integrity_check and write /output/common_design_envelope.json plus results/reports/logs
    and SUMMARY.md.
  infra_node: worker
  command: python3 -u /app/run.py
  input_schema:
    type: object
    required: []
    properties: {}
