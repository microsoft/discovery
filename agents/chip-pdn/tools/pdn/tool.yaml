name: pdn
description: |
  Chip power-delivery-network tool. Uses OpenROAD pdngen to build the power grid (rings/straps/rails) on a floorplan DEF from a pdn config, check connectivity, and write a PDN DEF. Node-aware. Emits a Common Design Envelope.
version: 1.0.0
category: Chip Design
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-pdn:1.0.0'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 10Gi
      gpu: 0
    max_resources:
      cpu: 1
      ram: 2Gi
      storage: 40Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Run OpenROAD pdngen and write a PDN DEF. Emits grid connectivity and DEF ref to /output/common_design_envelope.json
    (Common Design Envelope).
  infra_node: worker
  command: python3 -B -u /app/run.py --params-file /input/params.json
  input_schema:
    type: object
    required: []
    properties: {}
