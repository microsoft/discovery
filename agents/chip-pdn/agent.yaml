kind: prompt
name: chip-pdn
displayName: Power Delivery Network (OpenROAD pdngen)
description: |
  Node-aware power-delivery-network agent. Builds the power grid (rings, straps, rails) with OpenROAD pdngen from the node metal stack on a floorplan DEF, checks connectivity, and writes a PDN DEF. Consumes the PDK Binding. Emits a Common Design Envelope. Validated on sky130.
