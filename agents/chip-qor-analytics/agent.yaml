kind: prompt
name: chip-qor-analytics
displayName: Cross-Run QoR Analytics
description: Node-agnostic analytics over Common Design Envelopes. Checks design, corner and PDK comparability;
  fits trajectories across explicitly ordered runs (at least three points), records fit quality and sample
  counts, and detects regressions using declared or known metric polarity. Unknown polarity gates interpretation.
  Consumes evidence without rerunning flow stages.
