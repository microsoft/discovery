name: design-review
description: |
  Node-agnostic signoff / design-review tool. Consumes Common Design Envelopes and adjudicates signoff readiness: required-gate coverage, un-waived violations, waiver validity (owner + justification + rule-deck version), and PPA vs budget. Violation counts are READ INDEPENDENTLY from each envelope's own metrics rather than inherited from the verdict the producing stage assigned itself, and a count that cannot be read caps the verdict at not_assessable. An EMPTY required_gates list is not a satisfied one: without it, coverage is checked only against the documented mandatory tapeout floor (DRC, LVS, antenna) and the verdict is capped at not_assessable. Never launders an un-waived violation or an unjustified waiver into a pass. Emits a Common Design Envelope to /output/common_design_envelope.json. Consumes envelopes only.
version: 1.2.0
category: Chip Design
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-ppa-signoff-design-review:1.2.0'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 5Gi
      gpu: 0
    max_resources:
      cpu: 4
      ram: 8Gi
      storage: 10Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Review immutable /input/params.json; preserve native verdict and emit /output/common_design_envelope.json.
    Domain fail or invalid input exits nonzero and logs the exact persisted CDE_JSON. Never re-runs a
    flow stage.
  infra_node: worker
  command: python3 -B -u /app/run.py --params-file /input/params.json
  input_schema:
    type: object
    required: []
    properties: {}
