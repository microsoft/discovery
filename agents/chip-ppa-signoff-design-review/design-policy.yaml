schema_version: design-policy/1.0
owner: design-review
node_awareness: node-agnostic
pdk_binding:
  required: false
review:
  consumes_envelopes_only: true
  never_reruns_flow: true
  every_gate_requires_evidence: true
  separate_observation_from_interpretation: true
  report_confidence_and_risk: true
waivers:
  required_fields: [owner, justification, rule_deck_version]
  unjustified_waiver_cannot_clear_violation: true
  invalid_waiver_max_verdict: pass_with_caveats
signoff:
  unwaived_violation_forces_fail: true
  missing_required_gate_behavior: block
  report_ppa_vs_budget: true
execution:
  envelope_missing_mandatory_fields: block
  malformed_output: block

# --- BEGIN generated effort block (catalog/gen_effort_policy.py) ---
effort:
  iterating: false
  metric_kind: unavailable
  rationale: >-
    stage not in the residual registry -- this agent does not own an iterable closure gate.
    Effort is bounded by max_attempts from the campaign effort-budget
    ledger plus human judgement; no metric-driven stall rule applies.
# --- END generated effort block ---
