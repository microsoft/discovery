name: dssp
description: "Assign protein secondary structure (helices, sheets, turns) from 3D coordinates using the classic Kabsch-Sander DSSP algorithm."
version: 1.0.0
category: Structural Biology
license: BSD-2-Clause
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/dssp:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: assign_secondary_structure
    description: "Run DSSP on each PDB/mmCIF structure and produce per-residue secondary-structure assignments."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action assign_secondary_structure --input {{input_directory}} --output {{output_directory}}"
