name: flowblind-prepare-study-v2
description: >-
  Routes one scientist-authored goal to an advertised reviewed FlowBlind
  method, validates one exact host-selected attachment, and publishes a
  deterministic result-free preparation asset.
version: 2.0.0
category: scientific-validation
infra:
  - name: flowblind-prepare-study-v2-container
    infra_type: container
    image:
      acr: "{name}.azurecr.io/flowblind-prepare-study-v2:2.0.0"
    compute:
      min_resources:
        cpu: 1
        ram: 1Gi
        storage: 1Gi
        gpu: 0
      max_resources:
        cpu: 1
        ram: 2Gi
        storage: 2Gi
        gpu: 0
      infiniband: false
      recommended_sku:
        - Standard_D2s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: prepare-study
    description: >-
      Prepare one reviewed regional-agreement or vector/time-readiness study
      from the immutable host-selected candidate.csv at the input mount root.
      Supply only the scientific fields needed by the matched method.
    infra_node: flowblind-prepare-study-v2-container
    input_schema:
      type: object
      properties:
        researchGoal:
          type: string
          minLength: 1
          maxLength: 4096
          description: Scientist-authored research goal.
        decisionQuestion:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 4096
          description: Optional scientist-authored decision question.
        nextEvidenceIntent:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 4096
          description: Optional scientist-authored next-evidence intent.
        quantity:
          type: string
          minLength: 1
          maxLength: 4096
          description: Scientific quantity represented by the selected data.
        referenceMeaning:
          type: string
          minLength: 1
          maxLength: 4096
          description: Regional agreement only; meaning of reference_value.
        candidateMeaning:
          type: string
          minLength: 1
          maxLength: 4096
          description: Regional agreement only; meaning of candidate_value.
        vectorMeaning:
          type: string
          minLength: 1
          maxLength: 4096
          description: Vector/time readiness only; meaning of u and v.
        vectorSourceKind:
          enum:
            - generated
            - measured
            - simulation
        coordinateUnit:
          type: string
          minLength: 1
          maxLength: 4096
        valueUnit:
          type: string
          minLength: 1
          maxLength: 4096
        timeUnit:
          enum:
            - s
            - ms
        samplingKind:
          enum:
            - instantaneous
            - steady-state
            - frame-average
        selectedTime:
          type: number
        exposureDuration:
          type: number
          exclusiveMinimum: 0
        exposureOperator:
          enum:
            - uniform-window-average
            - unspecified
        timestampAnchor:
          enum:
            - start
            - midpoint
            - end
            - unspecified
        cycleStartTime:
          type: number
        cycleEndTime:
          type: number
        cyclePeriod:
          type: number
          exclusiveMinimum: 0
        cyclePhaseOrigin:
          type: number
        provenance:
          type: string
          minLength: 1
          maxLength: 4096
        license:
          type: string
          minLength: 1
          maxLength: 4096
      required:
        - researchGoal
    command: node /app/runtime/flowblind-prepare-study-v2.mjs
    environment_variables:
      - { name: FLOWBLIND_RESEARCH_GOAL, value: "{{researchGoal}}" }
      - { name: FLOWBLIND_DECISION_QUESTION, value: "{{decisionQuestion}}" }
      - { name: FLOWBLIND_NEXT_EVIDENCE_INTENT, value: "{{nextEvidenceIntent}}" }
      - { name: FLOWBLIND_METADATA_QUANTITY, value: "{{quantity}}" }
      - { name: FLOWBLIND_METADATA_REFERENCE_MEANING, value: "{{referenceMeaning}}" }
      - { name: FLOWBLIND_METADATA_CANDIDATE_MEANING, value: "{{candidateMeaning}}" }
      - { name: FLOWBLIND_METADATA_VECTOR_MEANING, value: "{{vectorMeaning}}" }
      - { name: FLOWBLIND_METADATA_VECTOR_SOURCE_KIND, value: "{{vectorSourceKind}}" }
      - { name: FLOWBLIND_METADATA_COORDINATE_UNIT, value: "{{coordinateUnit}}" }
      - { name: FLOWBLIND_METADATA_VALUE_UNIT, value: "{{valueUnit}}" }
      - { name: FLOWBLIND_METADATA_TIME_UNIT, value: "{{timeUnit}}" }
      - { name: FLOWBLIND_METADATA_SAMPLING_KIND, value: "{{samplingKind}}" }
      - { name: FLOWBLIND_METADATA_SELECTED_TIME, value: "{{selectedTime}}" }
      - { name: FLOWBLIND_METADATA_EXPOSURE_DURATION, value: "{{exposureDuration}}" }
      - { name: FLOWBLIND_METADATA_EXPOSURE_OPERATOR, value: "{{exposureOperator}}" }
      - { name: FLOWBLIND_METADATA_TIMESTAMP_ANCHOR, value: "{{timestampAnchor}}" }
      - { name: FLOWBLIND_METADATA_CYCLE_START_TIME, value: "{{cycleStartTime}}" }
      - { name: FLOWBLIND_METADATA_CYCLE_END_TIME, value: "{{cycleEndTime}}" }
      - { name: FLOWBLIND_METADATA_CYCLE_PERIOD, value: "{{cyclePeriod}}" }
      - { name: FLOWBLIND_METADATA_CYCLE_PHASE_ORIGIN, value: "{{cyclePhaseOrigin}}" }
      - { name: FLOWBLIND_METADATA_PROVENANCE, value: "{{provenance}}" }
      - { name: FLOWBLIND_METADATA_LICENSE, value: "{{license}}" }
    output_mount_configurations:
      - mount_path: /output
        auto_promote: true
        output_name: flowblind-study-preparation-v2
        output_description: Exact result-free content-addressed preparation files.
