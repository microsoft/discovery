name: flowblind-run-and-verify-study
description: >-
  Revalidates an exact candidate, generated sidecar, and preparation bundle
  after host confirmation, executes only the frozen reviewed
  regional-agreement or vector/time-readiness operation, verifies deterministic
  replay, and writes hash-bound reports.
version: 1.0.0
category: scientific-validation
infra:
  - name: flowblind-run-and-verify-study-container
    infra_type: container
    image:
      acr: "{name}.azurecr.io/flowblind-run-and-verify-study:1.0.0"
    compute:
      min_resources:
        cpu: 1
        ram: 1Gi
        storage: 1Gi
        gpu: 0
      max_resources:
        cpu: 1
        ram: 2Gi
        storage: 2Gi
        gpu: 0
      infiniband: false
      recommended_sku:
        - Standard_D2s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: run-and-verify-study
    description: >-
      After the catalog confirmation, run and independently replay the exact
      prepared study, then publish verified JSON, Markdown, HTML, and a commit
      marker.
    infra_node: flowblind-run-and-verify-study-container
    input_schema:
      type: object
      properties:
        researchGoal:
          type: string
          minLength: 1
          maxLength: 4096
          description: Exact scientist-authored goal used during preparation.
        decisionQuestion:
          type: string
          minLength: 1
          maxLength: 4096
          description: Exact optional decision question used during preparation.
        nextEvidenceIntent:
          type: string
          minLength: 1
          maxLength: 4096
          description: Exact optional next-evidence intent used during preparation.
      required:
        - researchGoal
    command: node /app/runtime/flowblind-run-and-verify-study.mjs
    environment_variables:
      - name: FLOWBLIND_RESEARCH_GOAL
        value: "{{researchGoal}}"
      - name: FLOWBLIND_DECISION_QUESTION
        value: "{{decisionQuestion}}"
      - name: FLOWBLIND_NEXT_EVIDENCE_INTENT
        value: "{{nextEvidenceIntent}}"
    output_mount_configurations:
      - mount_path: /output
        auto_promote: true
        output_name: flowblind-verified-study
        output_description: Deterministic verified JSON, Markdown, HTML, and verification evidence.
