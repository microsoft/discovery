name: viennarna
description: "RNA secondary-structure prediction and thermodynamics: minimum free energy folding, partition functions, and base-pair probabilities."
version: 1.0.0
category: RNA Bioinformatics
license: Custom (free for academic/non-commercial)
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/viennarna:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: fold_rna
    description: "Predict MFE secondary structure for each RNA sequence in the input FASTA."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action fold_rna --input {{input_directory}} --output {{output_directory}}"
