name: opsin
description: "Open Parser for Systematic IUPAC Nomenclature: convert chemical names into structures (SMILES/InChI/CML)."
version: 1.0.0
category: Cheminformatics
license: MIT
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/opsin:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: name_to_structure
    description: "Convert chemical names (one per line in a text file) to SMILES."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        output_format:
          type: string
          description: "SMILES, InChI, or CML (default SMILES)"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action name_to_structure --input {{input_directory}} --output {{output_directory}} {{#if output_format}}--output_format {{output_format}}{{/if}}"
