description: >
  An AI agent that combines clinical trial data, outcomes and scientific
  literature to identify relevant historical studies, benchmark protocol designs,
  assess clinical evidence, and provide evidence-based recommendations for
  protocol optimization. Built on expert.ai Protocol Design Intelligence (PDI);
  the current dataset covers breast cancer. Requires a PDI access token from
  expert.ai.
