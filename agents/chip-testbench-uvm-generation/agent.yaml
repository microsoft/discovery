name: chip-testbench-uvm-generation
displayName: Testbench and UVM Generation (cocotb / pyuvm)
description: |
  Node-agnostic verification-environment generator. Builds reusable UVM-style / cocotb testbenches (drivers, monitors, scoreboards, agents, BFMs, reference-model stubs) from the specification and shared verification plan (vplan). Infers intent from natural language, drives cocotb/pyuvm + Verilator/Icarus, and reports the generated environment and smoke-test result directly in chat.
