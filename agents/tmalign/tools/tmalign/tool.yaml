name: tmalign
description: "Sequence-order-independent protein structural superposition returning TM-score and RMSD for pairwise structure comparison."
version: 1.0.0
category: Structural Biology
license: Free for academic use
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/tmalign:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: align_structures
    description: "Structurally align a query PDB against one or more reference PDBs with TM-align."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        reference:
          type: string
          description: "Reference PDB filename to align against"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action align_structures --input {{input_directory}} --output {{output_directory}} {{#if reference}}--reference {{reference}}{{/if}}"
