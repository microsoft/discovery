name: tellurium
description: "Simulate and analyze SBML/Antimony kinetic models of biochemical networks with the libRoadRunner ODE engine."
version: 1.0.0
category: Systems Biology
license: Apache-2.0
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/tellurium:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: simulate_model
    description: "Run a deterministic time-course simulation of each SBML model."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        start:
          type: number
          description: "Simulation start time (default 0)"
        end:
          type: number
          description: "Simulation end time (default 100)"
        points:
          type: integer
          description: "Number of output points (default 200)"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action simulate_model --input {{input_directory}} --output {{output_directory}} {{#if start}}--start {{start}}{{/if}} {{#if end}}--end {{end}}{{/if}} {{#if points}}--points {{points}}{{/if}}"
