kind: prompt
name: chip-power-ir
displayName: Power and IR-Drop Analysis (OpenROAD PSM)
description: |
  Node-aware power and IR-drop analysis agent. Runs OpenROAD power analysis and PSM IR-drop on a routed DEF with SPEF and activity, reports power breakdown and worst IR drop vs the node budget, and screens EM. Consumes the PDK Binding. Emits a Common Design Envelope. Validated on sky130.
