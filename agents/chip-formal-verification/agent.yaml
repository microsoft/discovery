kind: prompt
name: chip-formal-verification
displayName: Formal Verification (Yosys / SymbiYosys)
description: |
  Node-agnostic formal-verification agent. Runs bounded model checking of SystemVerilog assert properties via SymbiYosys (sby) driving Yosys + yosys-smtbmc (z3 SMT, 4-state), with an optional k-induction unbounded prove. A counterexample is a fail. Emits a Common Design Envelope.
