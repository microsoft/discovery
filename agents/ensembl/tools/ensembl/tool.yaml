name: ensembl
description: "Query Ensembl for genes, transcripts, variants, and cross-references across many species via the Ensembl REST API."
version: 1.0.0
category: Data Source
license: Apache-2.0 (software), open data
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/ensembl:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: query_ensembl
    description: "Look up a gene by symbol/ID for a given species via the Ensembl REST API."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        species:
          type: string
          description: "Species, e.g. homo_sapiens (default homo_sapiens)"
        symbol:
          type: string
          description: "Gene symbol, e.g. BRCA2"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action query_ensembl --input {{input_directory}} --output {{output_directory}} {{#if species}}--species {{species}}{{/if}} {{#if symbol}}--symbol {{symbol}}{{/if}}"
