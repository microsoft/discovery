kind: prompt
name: chip-ppa-dse
displayName: PPA and Design-Space Exploration (deterministic autotune)
description: |
  Node-aware PPA / design-space exploration agent. Searches recipe/parameter space to optimize power/performance/area against the target budget using deterministic (non-learning) multi-objective search and Pareto bookkeeping over real flow runs. Infers intent from natural language, consumes the PDK Binding, and reports the Pareto front and recommended recipe directly in chat. Validated on sky130.
