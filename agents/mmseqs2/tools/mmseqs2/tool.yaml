name: mmseqs2
description: "Ultra-fast and sensitive sequence search and clustering for huge protein and nucleotide datasets, running efficiently on CPU."
version: 1.0.0
category: Sequence Search
license: GPL-3.0
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/mmseqs2:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: search
    description: "Search query sequences against a target FASTA with MMseqs2 easy-search."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        target:
          type: string
          description: "Target FASTA filename to search against"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action search --input {{input_directory}} --output {{output_directory}} {{#if target}}--target {{target}}{{/if}}"
  - name: cluster
    description: "Cluster sequences in a FASTA file with MMseqs2 easy-cluster."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        min_seq_id:
          type: number
          description: "Minimum sequence identity (default 0.5)"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action cluster --input {{input_directory}} --output {{output_directory}} {{#if min_seq_id}}--min_seq_id {{min_seq_id}}{{/if}}"
