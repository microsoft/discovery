name: nmrglue
description: "Read, process, and analyze NMR data from Bruker, Varian/Agilent, and NMRPipe formats. Extract spectra and basic processing metadata."
version: 1.0.0
category: Analytical Chemistry
license: BSD-3-Clause
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/nmrglue:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: process_nmr
    description: "Read NMRPipe (.ft/.fid) or Bruker datasets and report dimensions and basic stats."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action process_nmr --input {{input_directory}} --output {{output_directory}}"
