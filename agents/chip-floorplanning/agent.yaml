kind: prompt
name: chip-floorplanning
displayName: Floorplanning (OpenROAD)
description: |
  Node-aware floorplanning agent. Creates the die/core floorplan, sets rows/sites from the tech LEF, targets utilization, and places I/O pins using OpenROAD. Consumes the PDK Binding (tech LEF, site, tracks). Emits a Common Design Envelope with a floorplan DEF. Validated on SkyWater sky130.
