name: iqtree
description: "Maximum-likelihood phylogenetic inference with automatic substitution model selection (ModelFinder) and ultrafast bootstrap support."
version: 1.0.0
category: Phylogenetics
license: GPL-2.0
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/iqtree:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: build_tree
    description: "Infer a maximum-likelihood phylogenetic tree from a multiple sequence alignment."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        bootstrap:
          type: integer
          description: "Ultrafast bootstrap replicates (default 1000)"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action build_tree --input {{input_directory}} --output {{output_directory}} {{#if bootstrap}}--bootstrap {{bootstrap}}{{/if}}"
