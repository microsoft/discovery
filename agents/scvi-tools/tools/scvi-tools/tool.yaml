name: scvi-tools
description: Scaffold for GPU variational modeling of single-cell data using scVI, totalVI, and related
  scvi-tools models. Source-only; scientific runtime and image publication are deferred.
version: 0.1.0
category: Machine Learning / Bioinformatics
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/scvi-tools:0.1.0'
  compute:
    min_resources:
      cpu: 4
      ram: 32Gi
      gpu: 1
      storage: 0Gi
    max_resources:
      cpu: 96
      ram: 1800Gi
      gpu: 8
      storage: 0Gi
    infiniband: false
    recommended_sku:
    - Standard_NC40ads_H100_v5
    - Standard_NC80adis_H100_v5
    - Standard_NC24ads_A100_v4
    pool_type: static
    pool_size: 1
code_environments:
- language: python3
  command: python3 -u "/{{scriptName}}" > {{output_directory}}/logs.out 2>&1; code=$?; tail -n 100 {{output_directory}}/logs.out;
    exit "$code"
  description: |
    Planned scvi-tools GPU Python code environment.
    Not installed or deployed. Provision and validate runtime-plan.yaml before use.
    Planned dependencies: PyTorch with CUDA, scvi-tools and model-specific extras, AnnData, Scanpy.
    Planned interfaces: scvi.
    Use scvi_tools_utils for checked execution and explicit final_results.json artifacts.
    The scientific backend must explicitly use GPU; no silent CPU fallback.
  infra_node: worker
