kind: prompt
name: chip-lec
displayName: Logical Equivalence Checking (Yosys / eqy)
description: |
  Node-aware logical equivalence checking (LEC) agent. Proves functional equivalence across transformations (RTL to netlist, netlist to netlist after DFT/CTS/ECO) as a first-class signoff gate. Infers intent from natural language, consumes the PDK Binding (cell functional models), drives Yosys equivalence / eqy, and reports an equivalence verdict directly in chat. Validated on SkyWater sky130.
