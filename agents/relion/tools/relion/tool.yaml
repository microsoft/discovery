name: relion
description: Scaffold for GPU cryo-EM particle classification and refinement using RELION. Source-only;
  scientific runtime and image publication are deferred.
version: 0.1.0
category: AI & Machine Learning
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/relion:0.1.0'
  compute:
    min_resources:
      cpu: 4
      ram: 32Gi
      gpu: 1
      storage: 0Gi
    max_resources:
      cpu: 96
      ram: 1800Gi
      gpu: 8
      storage: 0Gi
    infiniband: false
    recommended_sku:
    - Standard_NC40ads_H100_v5
    - Standard_NC80adis_H100_v5
    - Standard_NC24ads_A100_v4
    pool_type: static
    pool_size: 1
code_environments:
- language: python3
  command: python3 -u "/{{scriptName}}" > {{output_directory}}/logs.out 2>&1; code=$?; tail -n 100 {{output_directory}}/logs.out;
    exit "$code"
  description: |
    Planned RELION GPU Python code environment.
    Not installed or deployed. Provision and validate runtime-plan.yaml before use.
    Planned dependencies: CUDA-enabled RELION build, FFTW, MPI when required, Cryo-EM image processing dependencies.
    Planned interfaces: relion_refine and release-specific pipeline tools.
    Use relion_utils for checked execution and explicit final_results.json artifacts.
    The scientific backend must explicitly use GPU; no silent CPU fallback.
  infra_node: worker
