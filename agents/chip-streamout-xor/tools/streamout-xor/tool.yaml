name: streamout-xor
description: |
  Real KLayout layout XOR plus independent Magic/KLayout DEF streamout XOR. When the PDK has no Magic tech but a reference_layout is supplied, dual_streamout_xor runs a labelled single-engine KLayout-vs-reference reproducibility XOR (verdict capped at pass_with_caveats). Supports GDSII and OASIS and emits a fail-closed Common Design Envelope.
version: 1.2.43
category: Chip Design
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-streamout-xor:1.2.43'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 10Gi
      gpu: 0
    max_resources:
      cpu: 2
      ram: 4Gi
      storage: 60Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Run xor_gds or dual_streamout_xor; write common_design_envelope.json, SUMMARY.md, and split
    artifacts.
  infra_node: worker
  command: python3 -u /app/run.py
  input_schema:
    type: object
    required: []
    properties: {}
