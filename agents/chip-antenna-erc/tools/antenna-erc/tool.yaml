name: chip-antenna-erc
description: 'Chip antenna / ERC tool. Node-aware antenna signoff with TWO engines selected from the PDK
  binding: (a) a KLayout antenna/ERC deck (parses the .lyrdb report database) for PDKs that ship one;
  (b) Magic `antennacheck` against the PDK Magic techfile''s antenna directives for sky130 and other PDKs
  that ship NO KLayout antenna deck. Reports a pass/fail verdict with waiver adjudication. antenna_rules
  / erc_rules (deck or techfile + engine) come from the PDK binding. Emits a Common Design Envelope.'
version: 1.0.1
category: Chip Design
license: MIT
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-antenna-erc:1.0.1'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 10Gi
      gpu: 0
    max_resources:
      cpu: 2
      ram: 4Gi
      storage: 60Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Run KLayout antenna / ERC deck and report violations. Emits violation count + per-check
    breakdown + verdict to /output/final_results.json (Common Design Envelope).
  infra_node: worker
  command: python3 -u /app/action_launcher.py
  input_schema:
    type: object
    properties: {}
    required: []
