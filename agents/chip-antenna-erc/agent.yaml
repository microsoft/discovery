kind: prompt
name: chip-antenna-erc
displayName: Antenna and ERC (KLayout)
description: |
  Node-aware Antenna and Electrical-Rule-Check agent. Runs the antenna/ERC check with the engine the PDK ships -- a KLayout antenna/ERC deck where one exists, or Magic `antennacheck` against the PDK Magic techfile for sky130 and other PDKs with no KLayout antenna deck -- on a GDS/OASIS/DEF layout, and reports the violation count with a per-check breakdown and waiver adjudication. Consumes the PDK Binding (antenna ratios / ERC rules). Emits a Common Design Envelope. Validated on sky130.
