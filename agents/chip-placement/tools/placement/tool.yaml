name: placement
description: |
  Chip placement tool. Uses OpenROAD to run global and detailed placement on a floorplan DEF at a target density, legalize, and write a placed DEF. Node-aware. Emits a Common Design Envelope.
version: 1.2.0
category: Chip Design
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-placement:1.2.0'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 10Gi
      gpu: 0
    max_resources:
      cpu: 1
      ram: 2Gi
      storage: 80Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Run OpenROAD global+detailed placement and write a placed DEF. Emits legality/density and
    DEF ref to /output/final_results.json (Common Design Envelope).
  infra_node: worker
  command: python3 -u /app/run.py '{{params_json}}'
  input_schema:
    type: object
    required:
    - params_json
    properties:
      params_json:
        type: string
        description: Single-line JSON object with an explicit supported scenario. Read the complete parameter
          contract in catalog-details.json and the agent instructions. Do not invent timing or PPA intent.
