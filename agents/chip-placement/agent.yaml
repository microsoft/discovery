kind: prompt
name: chip-placement
displayName: Placement (OpenROAD)
description: |
  Node-aware placement agent. Runs OpenROAD global and detailed placement with legality and density management on a floorplan DEF, and writes a placed DEF. Consumes the PDK Binding. Emits a Common Design Envelope. Validated on sky130.
catalog_metadata:
  schema_version: catalog-agent-metadata/1.0
  source: catalog/chip-design-README.md
  asset_class: agent
  canonical_name: Placement Agent
  flow_stage: D - Physical Implementation
  node_awareness: node-aware
  tier: 1
  nature: reasoning / orchestrated
  required_tools:
  - Placement Tool
  required_skills:
  - Congestion and Routability Skill
  - Timing Closure Skill
  - PDK Binding Skill
  - QoR Reporting Skill
  - Provenance Skill
