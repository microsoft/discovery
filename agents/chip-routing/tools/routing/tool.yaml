name: routing
description: |
  Chip routing tool. Uses OpenROAD FastRoute (global) + TritonRoute (detailed) to route a post-CTS DEF, report DRC/short/open counts, and write a routed DEF. MEASURES ROUTING CONGESTION from the global-route report (per-layer track demand vs resource, and per-GCell overflow) and emits it as a QoR metric -- congestion is reported, not merely accepted as an effort knob. Congestion is carried into the envelope even when detailed routing then fails, since it is often the reason. Node-aware. Emits a Common Design Envelope.
version: 1.5.0
category: Chip Design
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-routing:1.5.0'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 20Gi
      gpu: 0
    max_resources:
      cpu: 1
      ram: 2Gi
      storage: 120Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Run OpenROAD global+detailed routing and write a routed DEF. Emits DRC/short/open counts
    and DEF ref to /output/common_design_envelope.json (Common Design Envelope).
  infra_node: worker
  command: python3 -B -u /app/run.py --params-file /input/params.json
  input_schema:
    type: object
    required: []
    properties: {}
