name: cobrapy
description: "Constraint-based reconstruction and analysis of genome-scale metabolic models: flux-balance analysis, FVA, and gene knockouts."
version: 1.0.0
category: Systems Biology
license: LGPL-2.0/GPL-2.0
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/cobrapy:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: flux_balance_analysis
    description: "Load SBML metabolic models and run flux-balance analysis, reporting the objective value."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action flux_balance_analysis --input {{input_directory}} --output {{output_directory}}"
