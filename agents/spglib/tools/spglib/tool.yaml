name: spglib
description: "Crystal symmetry analysis: find space groups, symmetry operations, standardized cells, and Wyckoff positions."
version: 1.0.0
category: Materials Science
license: BSD-3-Clause
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/spglib:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: analyze_symmetry
    description: "Determine the space group and symmetry operations for each crystal structure."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        symprec:
          type: number
          description: "Symmetry tolerance (default 1e-5)"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action analyze_symmetry --input {{input_directory}} --output {{output_directory}} {{#if symprec}}--symprec {{symprec}}{{/if}}"
