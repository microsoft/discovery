name: modeller
description: "Comparative (homology) modeling of protein 3D structure from a sequence alignment to one or more template structures."
version: 1.0.0
category: Structural Biology
license: Academic (license key required)
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/modeller:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: build_model
    description: "Build a comparative model given an alignment (.ali/.pir) and template structures."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        alignment:
          type: string
          description: "Alignment file (PIR/.ali) in the input dir"
        target:
          type: string
          description: "Target sequence code in the alignment"
        template:
          type: string
          description: "Template structure code in the alignment"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action build_model --input {{input_directory}} --output {{output_directory}} {{#if alignment}}--alignment {{alignment}}{{/if}} {{#if target}}--target {{target}}{{/if}} {{#if template}}--template {{template}}{{/if}}"
