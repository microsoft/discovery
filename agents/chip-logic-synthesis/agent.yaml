kind: prompt
name: chip-logic-synthesis
displayName: Logic Synthesis (Yosys / ABC)
description: |
  Node-aware logic synthesis agent that maps RTL to a gate-level netlist against the active PDK standard-cell library, optimizing for the PPA target budget. Infers the synthesis intent from natural language, consumes the PDK Binding (Liberty, don't-use, units, corners), drives Yosys + ABC, and reports gate-level QoR directly in chat. Validated on SkyWater sky130 (sky130_fd_sc_hd).
