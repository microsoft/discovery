name: hmmer
description: "Profile hidden Markov model search for sensitive detection of remote homologs and protein domains (Pfam-style)."
version: 1.0.0
category: Sequence Search
license: BSD-3-Clause
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/hmmer:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: hmmbuild
    description: "Build a profile HMM from a multiple sequence alignment."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action hmmbuild --input {{input_directory}} --output {{output_directory}}"
  - name: hmmsearch
    description: "Search a sequence database with a profile HMM."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        hmm:
          type: string
          description: "Profile HMM filename"
        seqdb:
          type: string
          description: "Sequence database FASTA filename"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action hmmsearch --input {{input_directory}} --output {{output_directory}} {{#if hmm}}--hmm {{hmm}}{{/if}} {{#if seqdb}}--seqdb {{seqdb}}{{/if}}"
