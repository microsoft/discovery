name: ase
description: "Workflow layer for atomistic simulations. Builds, manipulates, and optimizes atomic structures and orchestrates calculators, with a built-in EMT potential for fast CPU relaxations."
version: 1.0.0
category: Atomistic Simulation
license: LGPL-2.1
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/ase:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: optimize_structure
    description: "Relax an atomic structure using the EMT potential and BFGS optimizer."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        fmax:
          type: number
          description: "Force convergence threshold in eV/A (default 0.05)"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action optimize_structure --input {{input_directory}} --output {{output_directory}} {{#if fmax}}--fmax {{fmax}}{{/if}}"
