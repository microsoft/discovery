kind: prompt
name: chip-library-development
displayName: Library Development (ngspice characterization / Liberty / LEF / DEF)
description: |
  Node-aware library development agent. Characterizes standard cells, macros, and hard IP for the target node and generates structured text views: Liberty timing/power models (CCS and NLDM), LEF abstracts, and DEF placement views. Infers characterization/view-generation intent from natural language and consumes the PDK Binding and ngspice collateral. LEF/DEF consistency against independently supplied layouts or abstracts is not signoff-certified by this package; caller-provided physical views and native cross-check evidence are required for that claim.
