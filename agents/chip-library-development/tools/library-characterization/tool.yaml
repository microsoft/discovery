name: chip-lib-characterize
description: Chip library characterization tool. Runs ngspice slew x load sweeps on a cell to extract
  propagation delay and build an NLDM Liberty timing table, and generates LEF abstract and DEF views.
  Node-aware (SPICE models/corners from the binding). Emits a Common Design Envelope.
version: 1.1.1
category: Chip Design
license: MIT
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-library-characterization:1.1.1'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 10Gi
      gpu: 0
    max_resources:
      cpu: 1
      ram: 2Gi
      storage: 20Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Characterize a cell (ngspice slew x load sweeps) into an NLDM Liberty, and generate LEF/DEF
    views. Emits characterized arcs, models, and view refs to /output/common_design_envelope.json (Common Design
    Envelope).
  infra_node: worker
  command: python3 -u /app/action_launcher.py
  input_schema:
    type: object
    properties: {}
    required: []
