description: |
  Node-aware library development agent. Characterizes standard cells, macros, and hard IP for the target node and generates structured text views: Liberty (CCS and NLDM) timing/power models, LEF abstracts, and DEF placement views. It consumes the PDK Binding and ngspice collateral. LEF/DEF consistency against independently supplied layouts or abstracts is not signoff-certified by this package.
