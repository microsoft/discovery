name: code-coverage
description: |
  Chip code-coverage tool. Measures Verilator-supported structural metrics (line, toggle, expression, user), reports unsupported requested metrics explicitly, merges coverage databases across seeds, and manages exclusions. Node-agnostic. Emits a Common Design Envelope.
version: 1.1.0
category: Chip Design
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-code-coverage:1.1.0'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 10Gi
      gpu: 0
    max_resources:
      cpu: 8
      ram: 16Gi
      storage: 20Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Run code-coverage measurement/merge/exclusion from structured JSON. Emits per-type coverage,
    uncovered items, and exclusion ledger to /output/common_design_envelope.json (Common Design Envelope).
  infra_node: worker
  command: python3 -B -u /app/run.py --params-file /input/params.json
  input_schema:
    type: object
    required: []
    properties: {}
