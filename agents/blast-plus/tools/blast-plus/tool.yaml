name: blast-plus
description: "Local sequence similarity search using the NCBI BLAST+ suite. Build custom databases and run blastn/blastp/blastx against them entirely offline."
version: 1.0.0
category: Sequence Search
license: Public Domain (NCBI)
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/blast-plus:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: makeblastdb
    description: "Build a BLAST database from a FASTA file in the input directory."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        dbtype:
          type: string
          description: "nucl or prot (default nucl)"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action makeblastdb --input {{input_directory}} --output {{output_directory}} {{#if dbtype}}--dbtype {{dbtype}}{{/if}}"
  - name: run_blast
    description: "Run a BLAST search of query sequences against a database."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        program:
          type: string
          description: "blastn, blastp, or blastx (default blastn)"
        db:
          type: string
          description: "Path to a prebuilt BLAST database"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action run_blast --input {{input_directory}} --output {{output_directory}} {{#if program}}--program {{program}}{{/if}} {{#if db}}--db {{db}}{{/if}}"
