name: kegg
description: "Query the KEGG database for pathways, reactions, compounds, and genes via the public KEGG REST API."
version: 1.0.0
category: Data Source
license: Free for academic use
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/kegg:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: query_kegg
    description: "Retrieve or search KEGG entries by identifier or keyword."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        operation:
          type: string
          description: "'get' or 'find' (default get)"
        database:
          type: string
          description: "KEGG database, e.g. pathway, compound, reaction, genes"
        query:
          type: string
          description: "Identifier (for get) or keyword (for find)"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action query_kegg --input {{input_directory}} --output {{output_directory}} {{#if operation}}--operation {{operation}}{{/if}} {{#if database}}--database {{database}}{{/if}} {{#if query}}--query {{query}}{{/if}}"
