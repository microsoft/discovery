name: eco
description: |
  Signoff ECO (engineering change order) tool. Clusters violating paths from a signoff STA report, scores candidate fix sites by dominance and perturbation, screens ECO entry, and executes ONE bounded, checkpointed, reversible repair wave per invocation by steering OpenROAD `repair_timing` / `repair_design` under scoped `set_dont_touch`. Encapsulates std-cell fill removal/insertion, incremental routing, PDN via repair, extraction and STA refresh. Node-aware. Emits a Common Design Envelope.
version: 1.6.0
category: Chip Design
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-eco:1.6.0'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 20Gi
      gpu: 0
    max_resources:
      cpu: 1
      ram: 2Gi
      storage: 60Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Analyze violating paths / run one ECO repair wave. Emits the Common Design Envelope to
    /output.
  infra_node: worker
  command: python3 -u /app/run.py '{{params_json}}'
  input_schema:
    type: object
    required:
    - params_json
    properties:
      params_json:
        type: string
        description: Single-line JSON object with an explicit supported scenario. Read the complete parameter
          contract in catalog-details.json and the agent instructions. Do not invent timing or PPA intent.
