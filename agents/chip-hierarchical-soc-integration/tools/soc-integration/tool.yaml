name: chip-soc-integration
description: Chip SoC integration tool. Assembles a block hierarchy, partitions top-level PPA budgets
  to blocks, defines interconnect topology, and checks interface consistency. Node-aware. Emits a Common
  Design Envelope.
version: 1.1.40
category: Chip Design
license: MIT
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-soc-integration:1.1.40'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 5Gi
      gpu: 0
    max_resources:
      cpu: 2
      ram: 4Gi
      storage: 20Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Assemble hierarchy, partition budgets, define interconnect. Emits per-block budgets, interconnect
    topology, and interface consistency to /output/common_design_envelope.json (Common Design Envelope).
  infra_node: worker
  command: python3 -u /app/action_launcher.py
  input_schema:
    type: object
    properties: {}
    required: []
