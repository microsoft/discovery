name: pymatgen
description: "Materials analysis library (the engine behind the Materials Project). Analyzes crystal structures, symmetry, densities, and generates I/O for common DFT codes."
version: 1.0.0
category: Materials Science
license: MIT
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/pymatgen:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: analyze_structure
    description: "Analyze crystal structures: space group, density, lattice parameters, and composition."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action analyze_structure --input {{input_directory}} --output {{output_directory}}"
