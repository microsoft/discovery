name: opendb-utilities
description: |
  Real OpenROAD/OpenDB database conversion, editing, reporting, and view-writing utility. Node-aware; emits a fail-closed Common Design Envelope.
version: 1.1.0
category: Chip Design
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-opendb-utilities:1.1.0'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 10Gi
      gpu: 0
    max_resources:
      cpu: 1
      ram: 2Gi
      storage: 80Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Run one OpenDB utility scenario; outputs common_design_envelope.json, REPORT.md, and results/reports/logs.
  infra_node: worker
  command: python3 -u /app/run.py '{{params_json}}'
  input_schema:
    type: object
    required:
    - params_json
    properties:
      params_json:
        type: string
        description: Single-line JSON object with an explicit supported scenario. Read the complete parameter
          contract in catalog-details.json and the agent instructions. Do not invent timing or PPA intent.
