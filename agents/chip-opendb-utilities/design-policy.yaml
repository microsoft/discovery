schema_version: design-policy/1.0
owner: chip-opendb-utilities
node_awareness: node-aware
pdk_binding:
  required: true
  resolved_by: PDK Binding and Node Management Agent
  consumed_fields: [pdk, tech_lef, cell_lef, liberty, sdc, tool_policy]
  precedence: [explicit_parameter, tool_policy.opendb_utilities, tool_default]
