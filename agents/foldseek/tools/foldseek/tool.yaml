name: foldseek
description: "Ultra-fast protein structure search and structural alignment, scaling structural comparison to millions of entries on CPU."
version: 1.0.0
category: Structural Search
license: GPL-3.0
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/foldseek:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: structure_search
    description: "Run Foldseek easy-search of query structures against a target set of structures."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        target_dir:
          type: string
          description: "Directory of target structures to search against"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action structure_search --input {{input_directory}} --output {{output_directory}} {{#if target_dir}}--target_dir {{target_dir}}{{/if}}"
