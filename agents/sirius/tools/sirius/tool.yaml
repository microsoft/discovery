name: sirius
description: "Metabolite structure elucidation from tandem mass spectra: molecular formula identification and structure ranking (CSI:FingerID)."
version: 1.0.0
category: Analytical Chemistry
license: Free for academic use (login required for some features)
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/sirius:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: elucidate_structure
    description: "Run SIRIUS formula identification on MS/MS input files (.ms/.mgf)."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action elucidate_structure --input {{input_directory}} --output {{output_directory}}"
