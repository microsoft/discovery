description: >
  Expert agent for high-throughput, GPU-first AI atomic simulation using the NVIDIA ALCHEMI Toolkit. Runs batched
  geometry relaxation and molecular dynamics (NVE, NVT, NPT, NPH) driven by machine-learned interatomic potentials
  (MACE, AIMNet2) composed with classical terms (Lennard-Jones, DFT-D3 dispersion, Ewald and PME electrostatics).
  Supports multi-stage fused pipelines, inflight batching for screening campaigns, Zarr trajectory capture, MLIP
  training and fine-tuning, and multi-GPU execution.
