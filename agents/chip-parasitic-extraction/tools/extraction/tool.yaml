name: extraction
description: |
  Chip parasitic-extraction tool. Uses OpenROAD OpenRCX to extract RC parasitics from a routed DEF and write per-corner SPEF for downstream STA/power. Node-aware. Emits a Common Design Envelope.
version: 1.0.0
category: Chip Design
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-extraction:1.0.0'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 10Gi
      gpu: 0
    max_resources:
      cpu: 2
      ram: 4Gi
      storage: 60Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Run OpenRCX extraction and write SPEF. Emits SPEF ref, corner, and net counts to /output/common_design_envelope.json
    (Common Design Envelope).
  infra_node: worker
  command: python3 -u /app/run.py
  input_schema:
    type: object
    required: []
    properties: {}
