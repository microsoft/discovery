name: reverberation-trust
description: >
  Reverberation-mapping trust toolkit for AGN continuum-to-line time lags. Provides independent
  lag estimators (interpolated CCF with FR/RSS, a DRW forward-model, and full JAVELIN), a
  sampling-fact arbiter that breaks estimator ties with the observing schedule rather than more
  estimators, verification gates (physical-lag window, red-noise false-alarm probability,
  aliasing/multimodality), independent Look/Channel witnesses, and a TrustState confidence
  tracker that assembles a calibrated verdict (refuse / low / medium / high).
version: "1.0.0"
category: astronomy
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/reverbtrust:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 8Gi
        gpu: 0
      max_resources:
        cpu: 2
        ram: 8Gi
        storage: 16Gi
        gpu: 0
      infiniband: false
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
code_environments:
  - language: python
    command: python3 "/{{scriptName}}"
    description: >
      Python code environment with the reverbtrust_utils library (numpy + scipy). Reads a
      light-curve bundle from /input, runs estimators + witnesses, and writes the trust
      verdict to /output.
    infra_node: worker
