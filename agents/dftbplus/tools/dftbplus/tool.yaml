name: dftbplus
description: "Density-functional tight-binding: fast approximate quantum simulations of large molecular and periodic systems on CPU."
version: 1.0.0
category: Quantum Chemistry
license: LGPL-3.0
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/dftbplus:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: run_dftb
    description: "Run DFTB+ using an hsd input file placed in the input directory."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action run_dftb --input {{input_directory}} --output {{output_directory}}"
