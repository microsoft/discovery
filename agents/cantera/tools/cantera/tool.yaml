name: cantera
description: "Chemical kinetics, thermodynamics, and transport for combustion and reacting flows. Compute equilibria and simulate reactors on CPU."
version: 1.0.0
category: Chemical Kinetics
license: BSD-3-Clause
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/cantera:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: equilibrate
    description: "Compute chemical equilibrium at given temperature and pressure for a gas mixture."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        mechanism:
          type: string
          description: "Mechanism file (.yaml) or built-in (default gri30.yaml)"
        temperature:
          type: number
          description: "Temperature in K (default 1500)"
        pressure:
          type: number
          description: "Pressure in Pa (default 101325)"
        composition:
          type: string
          description: "Mole-fraction string, e.g. 'CH4:1, O2:2, N2:7.52'"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action equilibrate --input {{input_directory}} --output {{output_directory}} {{#if mechanism}}--mechanism {{mechanism}}{{/if}} {{#if temperature}}--temperature {{temperature}}{{/if}} {{#if pressure}}--pressure {{pressure}}{{/if}} {{#if composition}}--composition {{composition}}{{/if}}"
