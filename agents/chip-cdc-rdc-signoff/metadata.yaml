description: Node-agnostic CDC/RDC signoff using Yosys and optional bounded formal checks. Enumerates
  crossings, checks synchronizers, and treats each multi-bit bus as one coherency obligation. Missing
  gray/handshake/qualifier/FIFO schemes fail closed. Formal evidence covers source-domain obligations
  only, to the recorded depth; metastability settling and reconvergence remain structural.
