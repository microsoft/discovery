name: uniprot
description: "Query the UniProt knowledgebase for protein sequences, functional annotations, and cross-references via its public REST API."
version: 1.0.0
category: Data Source
license: CC-BY-4.0 (data)
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/uniprot:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: query_uniprot
    description: "Search UniProtKB with a query string and save matching entries as JSON."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        query:
          type: string
          description: "UniProt query, e.g. 'kinase AND organism_id:9606'"
        size:
          type: integer
          description: "Max results (default 25)"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action query_uniprot --input {{input_directory}} --output {{output_directory}} {{#if query}}--query {{query}}{{/if}} {{#if size}}--size {{size}}{{/if}}"
