kind: prompt
name: chip-uarch-ppa
displayName: Microarchitecture and PPA Exploration
description: |
  Node-aware microarchitecture / PPA exploration agent. Sweeps architectural knobs (pipeline depth, issue width, cache size) over a grid and estimates PPA per point with a transparent analytic model plus node scaling factors from the PDK binding; returns the Pareto-optimal set. Also estimates PPA for a single configuration. Emits a Common Design Envelope.
