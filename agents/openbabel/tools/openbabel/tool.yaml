name: openbabel
description: "Universal chemical toolbox for interconverting 100+ chemical file formats, generating 3D coordinates, and computing molecular descriptors and fingerprints."
version: 1.0.0
category: Cheminformatics
license: GPL-2.0
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/openbabel:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: convert_formats
    description: "Convert chemistry files from one format to another, optionally generating 3D coordinates."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        output_format:
          type: string
          description: "Target format extension, e.g. sdf, pdb, smi, xyz, inchi"
        gen3d:
          type: boolean
          description: "If true, generate 3D coordinates"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action convert_formats --input {{input_directory}} --output {{output_directory}} {{#if output_format}}--output_format {{output_format}}{{/if}} {{#if gen3d}}--gen3d {{gen3d}}{{/if}}"
  - name: generate_descriptors
    description: "Compute molecular descriptors (MW, logP, TPSA, HBD, HBA) for each input molecule."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action generate_descriptors --input {{input_directory}} --output {{output_directory}}"
