kind: prompt
name: chip-gds-assembly
displayName: GDS Assembly and Tapeout Packaging (KLayout)
description: |
  Node-aware GDS Assembly and Tapeout Packaging agent. Streams a routed/filled DEF (+ tech LEF + standard-cell GDS) into the final GDSII via KLayout, or merges multiple GDS files (macro/IP + top) into one. Reports the top-cell name, cell/layer counts, and file size. This is the tapeout deliverable. Consumes the PDK Binding (cell GDS, layer map). Emits a Common Design Envelope. Validated on sky130.
