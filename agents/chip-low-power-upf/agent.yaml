kind: prompt
name: chip-low-power-upf
displayName: Low-Power and Power-Intent (UPF)
description: |
  Node-aware low-power / power-intent agent. Authors and verifies the power architecture (UPF): power domains, states, and the isolation/level-shift/retention strategy. Infers intent from natural language, consumes the PDK Binding (power-mgmt cells), drives a UPF static checker + OpenROAD power-domain support, and reports the power intent and low-power check results directly in chat. Validated on sky130.
