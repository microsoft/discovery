description: |
  Node-aware low-power / power-intent agent that authors and verifies the power architecture (UPF): power domains, states, and the isolation/level-shift/retention strategy. Consumes the PDK Binding (power-mgmt cells), drives a UPF static checker + OpenROAD power-domain support, and reports the power intent and low-power check results. Validated on SkyWater sky130.
