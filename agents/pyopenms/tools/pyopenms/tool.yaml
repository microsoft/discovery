name: pyopenms
description: "Mass-spectrometry data processing for proteomics and metabolomics: read mzML, inspect spectra, and extract peak/feature information."
version: 1.0.0
category: Analytical Chemistry
license: BSD-3-Clause
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/pyopenms:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: process_spectra
    description: "Read mzML files and summarize spectra (counts, MS levels, base peak)."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action process_spectra --input {{input_directory}} --output {{output_directory}}"
