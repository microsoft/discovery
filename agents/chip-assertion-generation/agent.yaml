kind: prompt
name: chip-assertion-generation
displayName: Assertion (SVA) Generation (SVA / SymbiYosys)
description: |
  Node-agnostic assertion generator. Authors non-vacuous SystemVerilog assertions (SVA) and cover properties capturing design and protocol intent from the shared verification plan (vplan). Infers intent from natural language, drives SVA authoring + SymbiYosys/Yosys formal checkability screening, and reports assertions with formal-checkability status directly in chat.
