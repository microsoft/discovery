name: rtl-lint
description: >
  Verible RTL lint and canonical formatting on immutable sources.
  Mount sources and params.json at /input; CDE is /output/common_design_envelope.json.
version: 1.2.0
category: "Chip Design"
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/rtl-lint:latest"
    compute:
      pool_type: static
      pool_size: 1
      recommended_sku: [Standard_D2as_v6]
      min_resources: {cpu: 1, ram: "1Gi", storage: "5Gi", gpu: 0}
      max_resources: {cpu: 4, ram: "8Gi", storage: "10Gi", gpu: 0}
actions:
  - name: run
    description: >
      One operation from /input/params.json (see bundled params.schema.json).
      scenario: lint_gate (complete gate), lint or format (diagnostic subchecks).
      Exactly one of source (/input path) or sources (nonempty array).
      Strict closure uses ruleset default, format_gating true, indentation_spaces 2,
      no waivers, rule overrides, style reclassification or config search.
      Preserve optional diagnostic configurations as explicitly limited evidence,
      never substitute them for DEFAULT closure. Formatting proposals are separate.
      Requires caller-configured /input read-only, /output, /workdir, /tmp,
      /var/tmp, /home/worker, /run and /dev/shm mounts; see package README.
      Exit 0 requires persisted completed/pass, not merely a completed subcheck.
      This declaration alone does not register an action in the local app.
    infra_node: worker
    command: "python3 -B -u /app/run.py --params-file /input/params.json"
    input_schema:
      type: object
      properties: {}
      required: []
