name: alphafold-db
description: "Retrieve precomputed protein structure predictions and confidence scores from the AlphaFold Protein Structure Database (no inference)."
version: 1.0.0
category: Data Source
license: CC-BY-4.0 (data)
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/alphafold-db:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: fetch_structure
    description: "Fetch AlphaFold predicted structures by UniProt accession (one per line or via parameter)."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        accession:
          type: string
          description: "UniProt accession, e.g. P00520 (optional if a file is provided)"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action fetch_structure --input {{input_directory}} --output {{output_directory}} {{#if accession}}--accession {{accession}}{{/if}}"
