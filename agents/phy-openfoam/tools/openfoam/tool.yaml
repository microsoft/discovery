name: phy-openfoam
description: >
  OpenFOAM Foundation 14 physics worker. Stages a frozen, safety-checked case, runs meshing and
  foamRun under a no-network, read-only, resource-bounded container, and measures native evidence
  (checkMesh, solver logs, per-step mass/flux/extrema monitors, saved fields). Acceptance is
  decided by the deterministic contract, never by the model.
version: 0.2.1
category: "Physics-Based Simulations"
# Aggregate image summary, not a dual-license offer for the MIT host code.
# Gmsh's GPLv2-or-later linking exception and other terms are preserved in notices.
license: "MIT AND GPL-3.0-or-later AND GPL-2.0-or-later"

infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/phy-openfoam:0.2.1"
    compute:
      min_resources:
        cpu: 2
        ram: "8Gi"
        storage: "20Gi"
        gpu: 0
      max_resources:
        cpu: 8
        ram: "32Gi"
        storage: "64Gi"
        gpu: 0
      recommended_sku:
        - Standard_E4as_v6
      pool_type: static
      pool_size: 1

actions:
  - name: evaluate
    description: >
      Freeze, lint, mesh, solve, measure, and assess one case bundle inside this container, continuing
      only to the frozen horizon by the deterministic rule. Returns the signed verdict record in
      /output/result.json. The agent cannot touch the run during the job.
    infra_node: worker
    command: "python -m discovery_physics.service evaluate --bundle-b64gz {{ bundle_b64gz }} --confirmations-b64 {{ confirmations_b64 }}"
    input_schema:
      type: object
      required: [bundle_b64gz, confirmations_b64]
      properties:
        bundle_b64gz:
          type: string
          minLength: 1
          maxLength: 65536
          pattern: "^[A-Za-z0-9+/=]+$"
          description: "gzip-compressed, base64-encoded CaseBundle JSON (see `discovery-physics schema bundle`)"
        confirmations_b64:
          type: string
          minLength: 1
          maxLength: 65536
          pattern: "^[A-Za-z0-9+/=]*$"
          description: "base64 of a JSON list of user confirmations (use W10= for none)"
    output_mount_configurations:
      - mount_path: /output
        auto_promote: true
        output_name: physics-evaluation
        output_description: "Signed journal, evidence, assessment, report, figures, and logs"
  - name: study
    description: >
      Run a study (sweep, refinement with GCI, or design candidates) and return the study verdict.
    infra_node: worker
    command: "python -m discovery_physics.service study --spec-b64gz {{ spec_b64gz }}"
    input_schema:
      type: object
      required: [spec_b64gz]
      properties:
        spec_b64gz:
          type: string
          minLength: 1
          maxLength: 65536
          pattern: "^[A-Za-z0-9+/=]+$"
          description: "gzip-compressed, base64-encoded Study JSON (see `discovery-physics schema study`)"
    output_mount_configurations:
      - mount_path: /output
        auto_promote: true
        output_name: physics-study
        output_description: "Member runs and the study assessment/report"
  - name: lint
    description: "Validate and lint a bundle without running it (contract/metric binding, safety, cost estimate)."
    infra_node: worker
    command: "python -m discovery_physics.service lint --bundle-b64gz {{ bundle_b64gz }}"
    input_schema:
      type: object
      required: [bundle_b64gz]
      properties:
        bundle_b64gz:
          type: string
          minLength: 1
          maxLength: 65536
          pattern: "^[A-Za-z0-9+/=]+$"
          description: "gzip-compressed, base64-encoded CaseBundle JSON"
    output_mount_configurations:
      - mount_path: /output
        auto_promote: false
        output_name: physics-lint
        output_description: "Lint result"
