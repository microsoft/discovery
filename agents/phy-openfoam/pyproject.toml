[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools/openfoam/src", "."]
addopts = "-ra --strict-markers"
markers = ["integration: requires a local container runtime and built image", "clio: requires the installed CLIO plugin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]