description: >
  Evidence-gated CFD on OpenFOAM Foundation 14 for arbitrary engineering requests. The agent
  authors a free-form case and a pre-registered scientific contract; deterministic checks on
  native solver evidence (health, conservation, horizon, stationarity, reference agreement)
  decide ACCEPT, REJECT, INCONCLUSIVE, or CORRECT_AND_RERUN. Corrections are bounded and audited.
