name: prody
description: "Protein dynamics analysis: elastic network models and normal-mode analysis (ANM/GNM) to study collective motions without MD."
version: 1.0.0
category: Structural Biology
license: MIT
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/prody:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: normal_mode_analysis
    description: "Compute ANM normal modes and predicted residue fluctuations for each protein."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        n_modes:
          type: integer
          description: "Number of low-frequency modes to compute (default 10)"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action normal_mode_analysis --input {{input_directory}} --output {{output_directory}} {{#if n_modes}}--n_modes {{n_modes}}{{/if}}"
