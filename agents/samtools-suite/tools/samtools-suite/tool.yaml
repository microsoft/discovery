name: samtools-suite
description: "Manipulate high-throughput sequencing alignments (SAM/BAM/CRAM) and variant calls (VCF/BCF): sorting, indexing, statistics, and filtering."
version: 1.0.0
category: Genomics
license: MIT
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/samtools-suite:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: process_alignments
    description: "Compute flagstat and idxstats summaries for BAM/CRAM alignment files."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action process_alignments --input {{input_directory}} --output {{output_directory}}"
  - name: process_variants
    description: "Compute summary statistics for VCF/BCF variant files with bcftools stats."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action process_variants --input {{input_directory}} --output {{output_directory}}"
