description: Node-aware KLayout geometry screening for windowed density, lithography-risk patterns, critical
  area, and Poisson random-defect yield. PDK limits are required; missing defect densities gate the result
  rather than inflate yield. OPC, resist and process-window simulation are outside scope. Emits a Common
  Design Envelope, not an OPC-readiness verdict.
