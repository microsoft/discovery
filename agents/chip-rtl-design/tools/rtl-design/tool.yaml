name: rtl-design
description: >
  Verify agent-authored RTL with Yosys, reset/synchronizer hygiene and canonical
  Verible formatting. Mount immutable sources and params.json at /input.
  Emits /output/common_design_envelope.json; artifacts use paths relative to /output.
version: 1.2.0
category: "Chip Design"
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/rtl-design:latest"
    compute:
      pool_type: static
      pool_size: 1
      recommended_sku: [Standard_D2as_v6]
      min_resources: {cpu: 1, ram: "2Gi", storage: "10Gi", gpu: 0}
      max_resources: {cpu: 8, ram: "16Gi", storage: "20Gi", gpu: 0}
actions:
  - name: run
    description: >
      One operation from /input/params.json (see bundled params.schema.json).
      Required scenario: check_authored, elaborate, lint_hygiene or cdc_scan;
      top: module name; exactly one of rtl (inline source) or rtl_files
      (nonempty array of /input paths). Agent authors RTL; this worker never does.
      check_authored verifies file bytes without mutation and saves separate
      formatting proposals. CDC enumeration is not CDC signoff.
      Requires caller-configured /input read-only, /output, /workdir, /tmp,
      /var/tmp, /home/worker, /run and /dev/shm mounts; see package README.
      Exit 0 requires persisted completed/pass; missing metrics cannot close a gate.
      This declaration alone does not register an action in the local app.
    infra_node: worker
    command: "python3 -B -u /app/run.py --params-file /input/params.json"
    input_schema:
      type: object
      properties: {}
      required: []
