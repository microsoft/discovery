name: biopython
description: "Foundational bioinformatics toolkit for sequence I/O and analysis: parse FASTA/GenBank/PDB, compute sequence statistics, translate, and manipulate biological sequences."
version: 1.0.0
category: Bioinformatics
license: BSD-3-Clause
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/biopython:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: parse_sequences
    description: "Parse sequence files and emit a per-record summary (id, length, description)."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action parse_sequences --input {{input_directory}} --output {{output_directory}}"
  - name: analyze_sequence
    description: "Compute GC content, molecular weight, and (for nucleotides) a protein translation per record."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action analyze_sequence --input {{input_directory}} --output {{output_directory}}"
