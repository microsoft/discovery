kind: prompt
name: chip-sta
displayName: Static Timing Analysis (OpenSTA)
description: |
  Node-aware multi-corner static timing analysis agent. Runs OpenSTA on a gate-level netlist with SDC and SPEF, reports WNS/TNS per corner, diagnoses violating paths, and drives timing closure. Consumes the PDK Binding (Liberty, corners). Emits a Common Design Envelope. Validated on SkyWater sky130.
