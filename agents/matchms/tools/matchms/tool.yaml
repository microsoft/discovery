name: matchms
description: "Import, process, and compute similarity between tandem mass spectra for metabolomics and small-molecule identification."
version: 1.0.0
category: Analytical Chemistry
license: Apache-2.0
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/matchms:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: compare_spectra
    description: "Compute pairwise cosine similarity across mass spectra in MGF/MSP files."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action compare_spectra --input {{input_directory}} --output {{output_directory}}"
