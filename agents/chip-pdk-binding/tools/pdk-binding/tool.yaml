name: chip-pdk-binding
description: Chip PDK binding / node management tool. Resolves a PDK reference into a complete, hash-pinned
  binding, validates completeness, and produces a node-switch diff. Emits a Common Design Envelope carrying
  the binding every node-aware agent consumes.
version: 1.0.1
category: Chip Design
license: MIT
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-pdk-binding:1.0.1'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 10Gi
      gpu: 0
    max_resources:
      cpu: 1
      ram: 2Gi
      storage: 40Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Resolve/validate/switch a PDK binding. Emits the complete hash-pinned binding, completeness
    report, and node-switch diff to /output/common_design_envelope.json (Common Design Envelope).
  infra_node: worker
  command: python3 -u /app/action_launcher.py
  input_schema:
    type: object
    properties: {}
    required: []
