name: msa-align
description: "Multiple sequence alignment via MAFFT, MUSCLE, or Clustal Omega for protein and nucleotide sequences."
version: 1.0.0
category: Sequence Alignment
license: Open source (per tool)
infra:
  - name: worker
    infra_type: container
    image:
      acr: "{name}.azurecr.io/msa-align:latest"
    compute:
      min_resources:
        cpu: 1
        ram: 4Gi
        storage: 32Gi
        gpu: 0
      max_resources:
        cpu: 4
        ram: 8Gi
        storage: 64Gi
        gpu: 0
      recommended_sku:
        - Standard_D4s_v6
      pool_type: static
      pool_size: 1
actions:
  - name: align
    description: "Build a multiple sequence alignment from a FASTA file."
    infra_node: worker
    input_schema:
      type: object
      properties:
        input_directory:
          type: string
          description: "Directory containing input files."
        output_directory:
          type: string
          description: "Directory where results are written."
        method:
          type: string
          description: "mafft, muscle, or clustalo (default mafft)"
      required:
        - input_directory
        - output_directory
    command: "python3 /app/entrypoint.py --action align --input {{input_directory}} --output {{output_directory}} {{#if method}}--method {{method}}{{/if}}"
