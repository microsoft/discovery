name: bodoe
description: >-
  Bayesian optimization and design-of-experiments environment. Gaussian-process
  surrogates (BoTorch/GPyTorch with a scikit-learn fallback), single- and
  multi-objective acquisitions (EI, LogEI, UCB, Thompson, ParEGO, EHVI),
  classical DoE (factorial, fractional factorial, Plackett-Burman, CCD,
  Box-Behnken), space-filling designs (Latin hypercube, Sobol) and mixture
  designs on the constrained simplex (simplex lattice, simplex centroid,
  extreme vertices). Input mount is /input, output mount is /output.
version: 1.0.0
category: scientific-computing
license: MIT
infra:
  - name: bodoe-container
    infra_type: container
    image:
      acr: "{name}.azurecr.io/bodoe:latest"
    compute:
      min_resources:
        cpu: 2
        ram: 8Gi
        storage: 8Gi
        gpu: 0
      max_resources:
        cpu: 8
        ram: 32Gi
        storage: 32Gi
        gpu: 0
      infiniband: false
      recommended_sku:
        - Standard_D4s_v6
        - Standard_D8s_v6
      pool_type: static
      pool_size: 1
code_environments:
  - language: python
    command: "python \"/{{scriptName}}\""
    description: "Python code environment on the bo-doe container image."
    infra_node: bodoe-container
