description: >
  Expert agent for Bayesian optimization and design of experiments. Plans experimental campaigns, generates classical,
  space-filling and mixture designs, fits Gaussian-process surrogates, and suggests the next batch of experiments for
  single- or multi-objective goals under hard constraints. Runs in a general Python environment with BoTorch available,
  so it can delegate to BoTorch directly when an unconstrained problem is better served that way.
