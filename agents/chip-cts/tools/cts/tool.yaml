name: cts
description: |
  Chip clock-tree-synthesis tool. Uses OpenROAD TritonCTS to build a balanced clock tree on a placed DEF, re-legalize, report skew/insertion delay, and write a post-CTS DEF. Node-aware. Emits a Common Design Envelope.
version: 1.2.0
category: Chip Design
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/chip-cts:1.2.0'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 10Gi
      gpu: 0
    max_resources:
      cpu: 1
      ram: 2Gi
      storage: 80Gi
      gpu: 0
    recommended_sku:
    - Standard_D2as_v6
    pool_type: static
    pool_size: 1
actions:
- name: run
  description: Run OpenROAD TritonCTS and write a post-CTS DEF. Emits skew/insertion delay and DEF ref
    to /output/final_results.json (Common Design Envelope).
  infra_node: worker
  command: python3 -B -u /app/run.py --params-file /input/params.json
  input_schema:
    type: object
    required: []
    properties: {}
