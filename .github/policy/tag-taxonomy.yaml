# Tag taxonomy — TAG-001 / TAG-002 / TAG-003
#
# Tags are how researchers find agents in the catalog. Free-text tags degrade
# fast: `protein-structure` and `protein_structures` and `ProteinStructure` all
# mean the same thing and none of them find each other. So the vocabulary is
# controlled, and adding to it is a reviewed act.
#
# Two kinds of tag exist:
#
#   DECLARED  — written by the author in metadata.yaml `tags:`. Must appear in
#               the `domains` vocabulary below.
#   COMPUTED  — derived by CI from what the agent actually contains, and
#               published in .auto-registry/. Authors must never declare these;
#               a self-assigned `has-tests` tag would be a claim, not a fact.
#
# To add a domain tag: open a PR against this file. It is CODEOWNERS-gated.
# Prefer an existing tag over a near-synonym.

