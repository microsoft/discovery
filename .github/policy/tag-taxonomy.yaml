# ── Computed namespace ──────────────────────────────────────────────────────
#
# Tags carrying any of these prefixes are emitted by CI only. A contributor who
# declares one is asserting something the catalog is supposed to verify.
reserved_prefixes:
  - "auto:"
  - "tier:"
  - "party:"
  - "capability:"

# Tags CI derives, documented here so the vocabulary is discoverable. Generated
# by .github/scripts/compute_tags.py into .auto-registry/agent-tags.json.
computed:
  - auto:has-tools           # agent ships one or more tools/
  - auto:no-tools            # prompt-only agent
  - auto:has-tests           # at least one test_*.py alongside a tool
  - auto:has-example-inputs  # ships example-input-files/
  - auto:third-party-notices # ships THIRD_PARTY_NOTICES.md
  - auto:gpu-required        # a tool requests gpu > 0
  - auto:official-base-image # every base image is a Docker Official Image
  - auto:pinned-base-image   # no floating base image tags
  - party:1p                 # publisher.party == 1p
  - party:3p                 # publisher.party == 3p
  - tier:bronze              # required rules pass
  - tier:silver              # bronze + tests + pinned base image
  - tier:gold                # silver + notices + example inputs
