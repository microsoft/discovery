name: Enable Native Auto-merge

# GitHub branch protection and the inherited organization ruleset are the
# authoritative merge gates. This workflow only:
#   1. enables GitHub's native auto-merge for each non-draft PR; and
#   2. supplies the one required approval for an exact, Microsoft-authored
#      Discovery release-manifest change.
#
# Required checks, strict branch updates, CODEOWNER approval, stale-review
# handling, last-push approval, and mergeability remain enforced by GitHub.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: native-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  configure:
    name: Enable GitHub auto-merge
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify manifest-only exception
        id: manifest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const trustedAssociations = new Set(['MEMBER', 'OWNER']);
            const currentPr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const eligible = (
              trustedAssociations.has(currentPr.data.author_association) &&
              files.length === 1 &&
              /^docs\/discovery-app\/releases\/manifests\/[a-z][a-z0-9-]*\.json$/
                .test(files[0].filename) &&
              ['added', 'modified'].includes(files[0].status)
            );
            core.setOutput('eligible', String(eligible));

      - name: Check approval App configuration
        if: steps.manifest.outputs.eligible == 'true'
        id: approval_app
        env:
          APPROVAL_APP_ID: ${{ secrets.REGISTRY_APP_ID }}
          APPROVAL_APP_PRIVATE_KEY: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${APPROVAL_APP_ID:-}" ] && [ -n "${APPROVAL_APP_PRIVATE_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Approval App credentials are unavailable; the manifest exception fails closed."
          fi

      # Organization policy prevents GITHUB_TOKEN from approving pull requests.
      # Use the installed App with a short-lived, repository-scoped token.
      - name: Generate approval App token
        if: steps.approval_app.outputs.configured == 'true'
        id: approval_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_APP_ID }}
          private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Approve manifest-only exception
        if: steps.approval_app.outputs.configured == 'true'
        env:
          APPROVAL_TOKEN: ${{ steps.approval_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APPROVED=$(GH_TOKEN="$APPROVAL_TOKEN" gh api \
            "/repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --slurp \
            --jq '[.[][] | select(.state == "APPROVED" and .user.login == "discovery-registry-bot[bot]")] | length')
          if [ "$APPROVED" -eq 0 ]; then
            GH_TOKEN="$APPROVAL_TOKEN" gh api \
              -X POST "/repos/$REPO/pulls/$PR_NUMBER/reviews" \
              -f event=APPROVE \
              -f body="Automated approval for an exact Microsoft-member Discovery release-manifest change. GitHub branch protection remains authoritative for schema validation, required checks, branch freshness, and mergeability." \
              >/dev/null
          fi

      - name: Enable native auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash --delete-branch; then
            echo "::warning::GitHub auto-merge could not be enabled. Branch protection remains in force and the PR can be merged manually."
          fi
