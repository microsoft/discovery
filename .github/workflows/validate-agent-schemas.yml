name: Validate Agent Schemas

# This workflow is a *required* status check on `main`. GitHub treats a
# non-triggered required check as "expected, never reported" which blocks PRs
# that don't touch the trigger paths. To avoid that, the workflow runs on
# every PR and uses an internal "Detect relevant changes" guard step — the
# real work is skipped (but the check still reports success) when none of
# the agent/tool/metadata schema files changed.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual schema validation"
        required: false
        default: "Manual schema validation"
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-schemas:
    name: Agent / tool / metadata schema regression guard (AS-001 – AS-005)
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      # NOTE: All PRs in this repo come from forks (including those by maintainers).
      # CODEOWNERS + branch protection are the merge gate; the schema-regression
      # checks below just verify that any proposed schema change doesn't break
      # the existing catalog. The workflow is data-only — it reads JSON files
      # as data and never executes PR-supplied code.

      - name: Detect relevant changes
        id: changes
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('relevant', 'true');
              core.notice('Manual dispatch: running the schema regression guard against the selected ref.');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const pattern = /^docs\/schemas\/(agent-schema-v2|common-schema|tool-definition-schema|metadata-schema)\.json$/;
            const relevant = files.some(({ filename }) => pattern.test(filename));
            core.setOutput('relevant', String(relevant));
            if (!relevant) {
              core.notice('No agent/tool/metadata schema files changed; reporting success without running regression guard.');
            }
      # Security boundary: the regression guard is *trusted* code checked out
      # from the PR base, run against the PR's proposed schemas as data. The PR
      # can therefore change the schemas under review but cannot alter or skip
      # the assertions that guard them.
      - name: Checkout trusted base (regression guard code)
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted
      - name: Checkout PR content as data
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pr
      - name: Set up Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pr/.github/requirements-ci.txt
      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: |
          # Pin CI dependency versions from the trusted base checkout. During
          # the bootstrap window - before this constraints file exists on the
          # base branch - install unpinned rather than reading the untrusted PR
          # copy. This self-heals to the pinned path once the PR merges.
          constraint="trusted/.github/requirements-ci.txt"
          if [ -f "$constraint" ]; then
            python -m pip install -c "$constraint" pytest jsonschema pyyaml referencing
          else
            echo "::notice::trusted constraints file absent on base (bootstrap); installing unpinned"
            python -m pip install pytest jsonschema pyyaml referencing
          fi
      - name: Run AS-001 through AS-005 schema checks against PR data
        if: steps.changes.outputs.relevant == 'true'
        env:
          # Trusted test code validates the PR-proposed catalog (pr/) as data.
          DISCOVERY_CATALOG_ROOT: ${{ github.workspace }}/pr
        run: |
          # Prefer the regression guard from the trusted base checkout so a PR
          # cannot weaken the assertions that guard its own schema changes.
          # During the bootstrap window - before this guard exists on the base
          # branch - run the PR copy (this PR introduces the guard and is human
          # reviewed). Self-heals to the trusted path once merged.
          test="trusted/.github/tests/test_schema_security.py"
          scripts="${{ github.workspace }}/trusted/.github/scripts"
          if [ ! -f "$test" ]; then
            echo "::notice::trusted regression guard absent on base (bootstrap); running the PR copy"
            test="pr/.github/tests/test_schema_security.py"
            scripts="${{ github.workspace }}/pr/.github/scripts"
          fi
          PYTHONPATH="$scripts" python -m pytest "$test" -q
