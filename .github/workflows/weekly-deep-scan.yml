name: Weekly Catalog Audit

# The PR gate is deliberately fast: it validates only what a pull request
# changed. That leaves two blind spots this workflow covers.
#
#   1. The catalog can drift as rules and policy evolve; PR-triggered checks
#      intentionally focus on changed content.
#   2. Rule and policy changes are only applied to touched files. A newly
#      tightened rule can sit unexercised against 45 untouched agents.
#
# Active today: the full-catalog rule audit and Microsoft Security DevOps
# (Bandit, Checkov, and Trivy filesystem analysis). The URL reputation and
# Docker Scout image-CVE jobs are staged but disabled until credentials,
# provider access, and representative runs are validated. Do not describe
# those staged jobs as active security coverage.

on:
  schedule:
    # 06:00 UTC Monday — results are waiting at the start of the week.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not publish SARIF or create/update the weekly drift issue"
        type: boolean
        default: true
      skip_image_scan:
        description: "Reserved for the staged Docker Scout rollout (currently disabled)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-deep-scan
  cancel-in-progress: false

jobs:
  # ── Every rule against every file ─────────────────────────────────────────
  full-catalog-audit:
    name: Full catalog rule audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      drifted: ${{ steps.audit.outputs.drifted }}
      summary: ${{ steps.audit.outputs.summary }}
      generated_artifacts_stale: ${{ steps.generated.outputs.stale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r .github/requirements-ci.txt

      - name: Audit every agent and starter kit
        id: audit
        run: |
          set -uo pipefail
          python .github/scripts/generate_baseline.py --report \
            | tee /tmp/full-audit.txt
          {
            echo "## Full catalog rule audit"
            echo
            echo '```'
            head -n 40 /tmp/full-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # --check fails when the catalog has violations the ratchet baseline
          # does not record, i.e. the catalog regressed since the last rollout.
          if python .github/scripts/generate_baseline.py --check > /tmp/drift.txt 2>&1; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            cat /tmp/drift.txt >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Catalog rule drift::The full-catalog audit found findings outside the ratchet baseline. A tracking issue will be filed or updated."
          fi
          SUMMARY=$(head -n 5 /tmp/full-audit.txt | tr '\n' ' ')
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"

      - name: Verify generated artefacts are current
        id: generated
        run: |
          if python .github/scripts/generate_rule_docs.py --check > /tmp/generated-artifacts.txt 2>&1; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            cat /tmp/generated-artifacts.txt >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Generated artifacts are stale::Generated rule documentation is not current. A tracking issue will be filed or updated."
          fi

      - name: Recompute catalog tags
        run: |
          # Reports only. The registry bot owns the committed file, so a diff
          # here means main moved without the bot running, not a PR problem.
          python .github/scripts/compute_tags.py --report >> "$GITHUB_STEP_SUMMARY"

      - name: Report staged scan capabilities
        run: |
          {
            echo "## Staged capabilities (not executed)"
            echo
            echo "- URLhaus and PhishTank reputation lookup"
            echo "- Docker Scout base-image CVE scan"
            echo
            echo "These jobs remain disabled until credentials, provider access,"
            echo "and representative runs are validated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-catalog-audit
          path: /tmp/full-audit.txt
          if-no-files-found: warn

  # ── Restricted malware and phishing reputation services ─────────────────
  url-reputation-audit:
    name: URLhaus and PhishTank reputation audit
    # Temporarily disabled: retain the implementation until provider access and
    # repository secrets are available and verified.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.reputation.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -c .github/requirements-ci.txt pyyaml

      # Configure both as repository Actions secrets. The script sends the
      # URLhaus key in Auth-Key and the PhishTank key in a POST body; neither
      # credential is placed in a URL, command line, artifact, or log message.
      #
      # Data-sharing note: this step discloses catalog webpage URLs to URLhaus
      # and PhishTank. url_reputation_audit.py first strips embedded credentials
      # and the query string/fragment, submitting only scheme://host[:port]/path
      # so tokens and sensitive parameters are never sent to the providers.
      - name: Check catalog URL reputation
        id: reputation
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          PHISHTANK_APP_KEY: ${{ secrets.PHISHTANK_APP_KEY }}
        run: |
          set -uo pipefail
          EXIT_CODE=0
          python .github/scripts/url_reputation_audit.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output /tmp/url-reputation.json \
            --summary-output /tmp/url-reputation.md \
            || EXIT_CODE=$?

          case "$EXIT_CODE" in
            0) STATUS=clean ;;
            1) STATUS=matches ;;
            *) STATUS=error ;;
          esac
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ -s /tmp/url-reputation.md ]; then
            cat /tmp/url-reputation.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## URL reputation audit" >> "$GITHUB_STEP_SUMMARY"
            echo "The audit exited without producing a report." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Findings are report-only here; the report job opens or updates the
          # weekly-deep-scan issue so transient provider errors do not hide the
          # rest of the scheduled security scan.
          exit 0

      - name: Upload URL reputation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: url-reputation-audit
          path: |
            /tmp/url-reputation.json
            /tmp/url-reputation.md
          if-no-files-found: warn

  # ── Enumerate the base images to scan ─────────────────────────────────────
  discover-images:
    name: Discover base images
    runs-on: ubuntu-slim
    timeout-minutes: 10
    # Temporarily disabled: retaining discovery and scan jobs makes Docker Scout
    # easy to restore after registry authentication is resolved.
    if: ${{ false && !inputs.skip_image_scan }}
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Enumerate distinct base images
        id: list
        run: |
          set -euo pipefail
          MATRIX=$(python .github/scripts/list_base_images.py --matrix)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          COUNT=$(echo "$MATRIX" | python -c "import json,sys; print(len(json.load(sys.stdin)['image']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Discovered $COUNT distinct base image(s)."
          python .github/scripts/list_base_images.py >> "$GITHUB_STEP_SUMMARY"

  # ── Docker Scout CVE scan, one job per image ──────────────────────────────
  scan-base-images:
    name: "Scout: ${{ matrix.image }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: discover-images
    if: ${{ needs.discover-images.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.discover-images.outputs.matrix) }}
    steps:
      # Docker Hub credentials raise the anonymous pull-rate limit and unlock
      # full Scout data. The scan degrades to public data when absent rather
      # than failing, so a fork or a secretless environment still gets signal.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan image for known vulnerabilities
        id: scout
        continue-on-error: true
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -uo pipefail
          # The immutable installer verifies the selected release checksum.
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/c7ac4ce317eafa536bf2421d1c223908e2200dce/install.sh \
            | sh -s -- -b "$HOME/.docker/scout" v1.24.0
          export PATH="$HOME/.docker/scout:$PATH"

          # Image reference comes from repository content, so pass it through
          # the environment rather than interpolating it into the shell.
          docker scout cves --only-severity critical,high \
            --format markdown "$IMAGE" > /tmp/scout.md 2>/tmp/scout.err || true

          {
            echo "### $IMAGE"
            echo
            if [ -s /tmp/scout.md ]; then
              cat /tmp/scout.md
            else
              echo "No Scout data returned. Details:"
              echo '```'
              head -n 20 /tmp/scout.err || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scout-${{ strategy.job-index }}
          path: /tmp/scout.md
          if-no-files-found: ignore

  # ── Microsoft Security DevOps over the catalog ────────────────────────────
  msdo:
    name: Microsoft Security DevOps
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    outputs:
      actionable: ${{ steps.summarize.outputs.actionable }}
      finding_count: ${{ steps.summarize.outputs.finding_count }}
      scan_status: ${{ steps.summarize.outputs.scan_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /agents/
            /starter-kits/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # MSDO bundles Bandit (Python), Checkov (Dockerfile/IaC), and Trivy
      # (filesystem CVEs) behind one Microsoft-maintained action that emits
      # SARIF. AntiMalware has no Linux configuration, so enabling it aborts
      # Guardian before the supported analyzers can produce results. A non-cone
      # sparse checkout keeps both the scan and uploaded SARIF strictly inside
      # the public catalog roots.
      - name: Run Microsoft Security DevOps
        id: msdo
        continue-on-error: true
        uses: microsoft/security-devops-action@08976cb623803b1b36d7112d4ff9f59eae704de0 # v1.12.0
        with:
          tools: bandit,checkov,trivy

      - name: Upload results to the Security tab
        if: ${{ !inputs.dry_run && steps.msdo.outputs.sarifFile != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
          category: msdo

      - name: Summarize catalog findings
        id: summarize
        if: always()
        env:
          SARIF_FILE: ${{ steps.msdo.outputs.sarifFile }}
          MSDO_OUTCOME: ${{ steps.msdo.outcome }}
        run: |
          set -uo pipefail
          python - <<'PY'
          import json, os, collections
          path = os.environ.get("SARIF_FILE") or ""
          outcome = os.environ.get("MSDO_OUTCOME", "unknown")
          summary = ["## Microsoft Security DevOps", ""]
          outputs = os.environ["GITHUB_OUTPUT"]
          if not path or not os.path.exists(path):
              summary.append("_No SARIF produced — check the MSDO step logs._")
              with open(outputs, "a", encoding="utf-8") as stream:
                  stream.write("actionable=true\nfinding_count=0\nscan_status=error\n")
              print("::warning title=Security scan incomplete::Microsoft Security DevOps produced no SARIF. A tracking issue will be filed or updated.")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                  stream.write("\n".join(summary) + "\n")
              raise SystemExit(0)
          data = json.load(open(path, encoding="utf-8"))
          counts = collections.Counter()
          for run in data.get("runs", []):
              tool = run.get("tool", {}).get("driver", {}).get("name", "unknown")
              for result in run.get("results", []):
                  for loc in result.get("locations", []):
                      uri = (loc.get("physicalLocation", {})
                                .get("artifactLocation", {})
                                .get("uri", ""))
                      # Only the publicly-contributed trees are in scope.
                      if uri.startswith(("agents/", "starter-kits/")):
                          counts[tool] += 1
                          break
          if counts:
              summary.extend((
                  "| Analyzer | Findings in agents/ and starter-kits/ |",
                  "|---|---|",
              ))
              for tool, n in sorted(counts.items()):
                  summary.append(f"| {tool} | {n} |")
          else:
              summary.append("No findings inside agents/ or starter-kits/.")
          finding_count = sum(counts.values())
          scan_status = "clean" if outcome == "success" else "error"
          actionable = finding_count > 0 or scan_status != "clean"
          with open(outputs, "a", encoding="utf-8") as stream:
              stream.write(f"actionable={str(actionable).lower()}\n")
              stream.write(f"finding_count={finding_count}\n")
              stream.write(f"scan_status={scan_status}\n")
          if finding_count:
              print(f"::warning title=Security findings detected::{finding_count} Microsoft Security DevOps finding(s) require review. The scheduled triage gate will remain red until a clean rerun.")
          elif scan_status != "clean":
              print("::warning title=Security scan incomplete::Microsoft Security DevOps did not complete successfully. The scheduled triage gate will remain red until a clean rerun.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(summary) + "\n")
          PY

      - name: Upload MSDO SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: msdo-sarif
          path: ${{ steps.msdo.outputs.sarifFile }}
          if-no-files-found: ignore

  # ── Keep the scheduled run red until every active concern is resolved ─────
  report:
    name: Require security triage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [full-catalog-audit, msdo]
    if: >-
      ${{
        !inputs.dry_run && !cancelled() &&
        (needs.full-catalog-audit.outputs.drifted == 'true' ||
         needs.full-catalog-audit.outputs.generated_artifacts_stale == 'true' ||
         needs.msdo.outputs.actionable == 'true')
      }}
    steps:
      - name: Fail until findings are resolved
        env:
          DRIFTED: ${{ needs.full-catalog-audit.outputs.drifted }}
          GENERATED_ARTIFACTS_STALE: ${{ needs.full-catalog-audit.outputs.generated_artifacts_stale }}
          MSDO_ACTIONABLE: ${{ needs.msdo.outputs.actionable }}
          MSDO_FINDING_COUNT: ${{ needs.msdo.outputs.finding_count }}
          MSDO_STATUS: ${{ needs.msdo.outputs.scan_status }}
        run: |
          {
            echo "## Weekly catalog audit requires triage"
            echo
            echo "- Catalog rule drift: ${DRIFTED:-unknown}"
            echo "- Generated artifacts stale: ${GENERATED_ARTIFACTS_STALE:-unknown}"
            echo "- MSDO actionable: ${MSDO_ACTIONABLE:-unknown}"
            echo "- MSDO findings: ${MSDO_FINDING_COUNT:-unknown}"
            echo "- MSDO status: ${MSDO_STATUS:-unknown}"
            echo
            echo "Review the job summaries and uploaded SARIF, resolve or disposition every finding under SECURITY.md, then rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Weekly catalog audit findings require owner triage. This scheduled run is the tracking record until a clean rerun succeeds."
          exit 1
