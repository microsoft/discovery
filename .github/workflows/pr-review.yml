name: PR Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# One run per PR at a time; cancel in-progress runs when a new commit arrives.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only validation of PR data; fork-run approval policies still apply.
# Diagnostic PR writes live in the separate pr-review-report.yml workflow.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Stage 1: Classify changed paths ───────────────────────────────────────
  classify:
    name: Classify Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed_files: ${{ steps.changed.outputs.all_changed_files }}
      has_agents: ${{ steps.changed.outputs.has_agents }}
      has_catalog: ${{ steps.changed.outputs.has_catalog }}
      has_docs_only: ${{ steps.changed.outputs.has_docs_only }}
      author_permission: ${{ steps.author_permission.outputs.permission }}
      author_association: ${{ steps.author_permission.outputs.association }}
    steps:
      # The API supplies the authoritative changed-file list without a checkout.
      - name: Get and classify changed files
        id: changed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const names = files.map(({ filename }) => filename);
            core.setOutput('all_changed_files', JSON.stringify(names));
            core.setOutput('has_agents', String(names.some(name => name.startsWith('agents/'))));
            core.setOutput(
              'has_catalog',
              String(names.some(name =>
                name.startsWith('agents/') || name.startsWith('starter-kits/')
              )),
            );
            core.setOutput(
              'has_docs_only',
              String(names.length > 0 && names.every(name => name.startsWith('docs/schemas/'))),
            );
            core.info(`Changed files (${names.length}):\n${names.join('\n')}`);

      - name: Resolve PR author trust
        id: author_permission
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = context.payload.pull_request.user.login;
            const trustedAssociations = new Set(['MEMBER', 'OWNER']);
            const knownPermissions = new Set([
              'admin', 'maintain', 'write', 'triage', 'read', 'none'
            ]);
            let permission = 'unknown';
            let association = 'NONE';

            try {
              const response = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username,
              });
              const reported = String(response.data.permission || '').toLowerCase();
              permission = knownPermissions.has(reported) ? reported : 'unknown';
            } catch (error) {
              if (error.status === 404) {
                permission = 'none';
              } else {
                core.warning(
                  `Could not resolve repository permission for @${username}; ` +
                  `applying public-contributor scope. ${error.message}`
                );
              }
            }

            try {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              association = String(
                response.data.author_association || 'NONE'
              ).toUpperCase();
            } catch (error) {
              core.warning(
                `Could not resolve current organization association for @${username}; ` +
                `applying public-contributor scope. ${error.message}`
              );
            }

            core.info(`Repository permission for @${username}: ${permission}`);
            core.info(
              `Microsoft organization trust for @${username}: ` +
              `${trustedAssociations.has(association)}`
            );
            core.setOutput('permission', permission);
            core.setOutput('association', association);

  # ── Stages 2–4: Structure + Schema + Policy (including Containerfiles) + Docs
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: classify
    steps:
      # Keep validator code separate from the PR content even with a read-only
      # token. Two-checkout pattern:
      #   1. `trusted/` — base SHA, source of the validator scripts.
      #   2. `pr/`      — PR head, the untrusted *content* the validator scans.
      # The runner only ever invokes Python that lives under `trusted/`.
      - name: Checkout trusted base (for validator scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          path: trusted
          persist-credentials: false

      - name: Checkout PR head (content under review — never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: true
          path: pr
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Use trusted base constraints, never the PR's requirements. The
          # legacy fallback is unpinned if that base lacks the constraints file;
          # prepare the trusted base before deploying validator changes.
          constraint="trusted/.github/requirements-ci.txt"
          if [ -f "$constraint" ]; then
            python -m pip install -c "$constraint" codespell dnspython jsonschema onnx picklescan pyyaml referencing
          else
            echo "::notice::trusted constraints file absent on base (bootstrap); installing unpinned"
            python -m pip install codespell dnspython jsonschema onnx picklescan pyyaml referencing
          fi

      - name: Write changed files list
        env:
          # JSON preserves spaces and other characters in attacker-controlled
          # paths. Pass via env and decode without shell evaluation.
          CHANGED_FILES_JSON: ${{ needs.classify.outputs.changed_files }}
        run: |
          python -c 'import json, os, pathlib; pathlib.Path("/tmp/changed-files.txt").write_text("".join(f"{p}\n" for p in json.loads(os.environ["CHANGED_FILES_JSON"])), encoding="utf-8")'
          echo "Changed files:"
          cat /tmp/changed-files.txt

      - name: Spellcheck changed catalog prose (non-blocking)
        continue-on-error: true
        run: |
          # Run trusted base-branch code against PR content as data. The script
          # extracts only approved prose fields and Markdown outside code fences.
          python trusted/.github/scripts/spellcheck_prose.py \
            --changed-files /tmp/changed-files.txt \
            --repo-root "$GITHUB_WORKSPACE/pr" \
            --output /tmp/spellcheck-results.json

      - name: Run validation
        id: run_validator
        env:
          # POL-011 exempts the bot-authored chore/registry-refresh PR so
          # the update-registry.yml workflow can actually land its output.
          # Exempt requires BOTH author and head ref to match.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # POL-021 treats an absent or failed lookup as public scope.
          # Microsoft organization members may contribute to any repository
          # path without receiving repository write access; correctness checks
          # and normal GitHub review protections remain authoritative.
          PR_AUTHOR_PERMISSION: ${{ needs.classify.outputs.author_permission || 'unknown' }}
          PR_AUTHOR_ASSOCIATION: ${{ needs.classify.outputs.author_association || 'NONE' }}
        run: |
          # Invoke validator from the trusted checkout (base SHA) against PR content.
          python trusted/.github/scripts/validate_pr.py \
            --changed-files /tmp/changed-files.txt \
            --repo-root "$GITHUB_WORKSPACE/pr" \
            --output /tmp/validation-results.json || true

          if [[ ! -f /tmp/validation-results.json ]]; then
            echo '{"passed":false,"failure_count":1,"has_agents":false,"has_markdown_only":false,"has_dockerfile":false,"has_code":false,"failures":[{"rule_id":"INTERNAL","file":"validate_pr.py","line":1,"message":"Validator crashed before writing output — check the workflow logs."}]}' > /tmp/validation-results.json
          fi

          PASSED=$(python -c "import json; d=json.load(open('/tmp/validation-results.json')); print('true' if d['passed'] else 'false')")
          # Fail the job so the GitHub check shows red when validation issues are found.
          # post-results still hands failure diagnostics to the reporting workflow.
          if [[ "$PASSED" == "false" ]]; then
            exit 1
          fi

      - name: Ensure results file exists
        if: always()
        run: |
          # Create fallback if an earlier step (checkout, pip install, etc.) failed
          # before run_validator had a chance to create the file.
          if [[ ! -f /tmp/validation-results.json ]]; then
            echo '{"passed":false,"failure_count":1,"has_agents":false,"has_markdown_only":false,"has_dockerfile":false,"has_code":false,"failures":[{"rule_id":"INTERNAL","file":"(workflow)","line":1,"message":"Validator crashed before producing results — check the Validate PR job logs for details."}]}' \
              > /tmp/validation-results.json
          fi

      - name: Summarize validation results
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.run_validator.outcome }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          VALIDATOR_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          python trusted/.github/scripts/render_ci_summary.py catalog \
            --report /tmp/validation-results.json \
            --title "PR catalog validation" \
            --outcome "$VALIDATION_OUTCOME" \
            --repository-url "$REPOSITORY_URL" \
            --revision "$VALIDATOR_REVISION" \
            --rerun-command "python .github/scripts/validate_pr.py --changed-files changed-files.txt --repo-root . --output validation-results.json"

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-results
          path: /tmp/validation-results.json
          overwrite: true
          if-no-files-found: error

      - name: Upload spellcheck results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spellcheck-results
          path: /tmp/spellcheck-results.json
          if-no-files-found: ignore
          overwrite: true

  # ── Stage 5: Secret scan ───────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TruffleHog scans pointer text and commit history; it does NOT need the
    # actual LFS payloads. Skipping the smudge filter keeps secret scanning
    # working even when LFS objects are unavailable to the file:// clone
    # TruffleHog does internally (e.g. fresh PR before LFS objects are
    # uploaded, exhausted LFS quota, force-pushed branch). Without this,
    # one PR's LFS hygiene problem kills secret scanning across the repo.
    # POL-009 catches LFS-hygiene problems separately in the validate job,
    # which DOES need real bytes for header sniffing.
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Run TruffleHog secret scan (verified — blocking)
        env:
          # Pass commit SHAs through the environment rather than interpolating
          # ${{ }} directly into the shell, to avoid expression/command
          # injection (MSRC 124614).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Install a pinned TruffleHog release from its immutable installer.
          # Pinning both prevents upstream changes from silently breaking every
          # PR and lets the installer verify the release checksum.
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/cc1fe982afc515d2991365ce8d4d0dd07170fcad/scripts/install.sh \
            | sh -s -- -b /usr/local/bin v3.97.2

          # Fetch Git objects without checking out PR-controlled files. No
          # privileged token or persisted credentials are exposed to the clone.
          # TruffleHog requires a work-tree repository with a .git directory;
          # it also reads the index and clones reachable refs internally. An
          # empty index plus temporary refs satisfy those requirements while
          # still avoiding a checkout of untrusted content.
          git init /tmp/pr-history
          git -C /tmp/pr-history read-tree --empty
          git -C /tmp/pr-history fetch --no-tags \
            "https://github.com/${BASE_REPOSITORY}.git" \
            "$BASE_SHA:refs/heads/trufflehog-base"
          git -C /tmp/pr-history fetch --no-tags \
            "https://github.com/${HEAD_REPOSITORY}.git" \
            "$HEAD_SHA:refs/heads/trufflehog-head"
          trufflehog git file:///tmp/pr-history \
            --since-commit "$BASE_SHA" \
            --branch "$HEAD_SHA" \
            --only-verified \
            --fail

      - name: SEC-002 — Audit-mode scan (unverified — non-blocking, informational)
        continue-on-error: true
        env:
          # Pass commit SHAs through the environment rather than interpolating
          # ${{ }} directly into the shell, to avoid expression/command
          # injection (MSRC 124614).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Re-run TruffleHog without --only-verified to surface high-entropy
          # strings and unverified credentials. This does NOT fail the build;
          # it produces an artefact so reviewers can spot dummy keys / leaked
          # placeholders that the verified scan deliberately ignores.
          set +e
          trufflehog git file:///tmp/pr-history \
            --since-commit "$BASE_SHA" \
            --branch "$HEAD_SHA" \
            --json \
            > /tmp/trufflehog-audit.json 2>/dev/null
          if [ -s /tmp/trufflehog-audit.json ]; then
            COUNT=$(wc -l < /tmp/trufflehog-audit.json)
            echo "::warning::SEC-002 audit-mode scan found ${COUNT} potential match(es). Download the trufflehog-audit-results artefact for details."
          else
            echo "SEC-002: audit-mode scan produced no findings."
          fi

      - name: Upload audit-mode results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trufflehog-audit-results
          path: /tmp/trufflehog-audit.json
          if-no-files-found: ignore
          overwrite: true

  # Keep this required check on the PR: workflow_run checks attach to the
  # default branch. Unlike removal's optional upload, this handoff must fail
  # if its validation report cannot be downloaded or uploaded.
  post-results:
    name: Post Results
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [classify, validate, secret-scan]
    # Hand off failures from non-cancelled runs, but do not queue for cancellation.
    if: ${{ !cancelled() }}
    steps:
      - name: Download validation results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-results
          path: ${{ runner.temp }}/pr-review-report

      - name: Publish attempt-scoped reporting data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-review-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-review-report/validation-results.json
          if-no-files-found: error

      - name: Summarize reporting handoff
        run: |
          echo "PR feedback will be published by the separate **PR Review Report** workflow after verifying this run and the current PR head. Required validation checks remain authoritative." >> "$GITHUB_STEP_SUMMARY"