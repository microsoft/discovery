name: PR Review Report

# Diagnostic publisher for both sources; never make this a required PR check.
on:
  workflow_run:
    workflows: [PR Review, Check Agent Removal Impact]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

# Isolate source profiles and avoid cancelling an in-flight writer.
concurrency:
  group: pr-review-report-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    name: Publish PR Feedback
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # For workflow_run, github.sha is the default-branch SHA, not the PR head.
      - name: Checkout trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify source run and publish feedback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python trusted/.github/scripts/report_pr_review.py
