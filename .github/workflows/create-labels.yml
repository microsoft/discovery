name: Create Repository Labels

on:
  workflow_dispatch: # Run manually once after repo setup

permissions:
  issues: write

jobs:
  create-labels:
    name: Create Labels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create all required labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = [
              { name: 'pr-validation-passed', color: '0e8a16', description: "The pr-review workflow's validator (validate_pr.py) passed. Other status checks (unit-tests, schema regression, etc.) report separately — see the PR status rollup for the full picture." },
              { name: 'pr-validation-failed', color: 'd73a4a', description: "The pr-review workflow's validator (validate_pr.py) failed; see inline comments. Other status checks report separately." },
              { name: 'human-review-approved',   color: '2cbe4e', description: 'A human reviewer has approved the PR' },
              { name: '1p-contribution',         color: '1d76db', description: "Authored by Microsoft (party='1p' in metadata)" },
              { name: '3p-contribution',         color: '0052cc', description: "Authored by a third-party partner (party='3p' in metadata)" },
              { name: 'docs-only',               color: 'cfd3d7', description: 'PR only modifies files in docs/schemas/' },
              { name: 'breaking-change',         color: 'b60205', description: 'PR introduces a breaking change to schema or structure' },
              { name: 'update-branch',           color: 'fbca04', description: 'PR branch is behind base — please update' },
              { name: 'needs-human-review',      color: '0075ca', description: 'Awaiting human approval' },
              { name: 'ready-for-auto-merge',    color: '0e8a16', description: 'All gates green — will be auto-merged' },
              { name: 'checks-in-progress',      color: 'ededed', description: 'One or more required status checks are still running on this PR. Removed automatically once all checks have reported.' },
              // ── Pull-request maintenance labels ──
              { name: 'maintenance: stale',      color: 'fbca04', description: 'Inactive PR is in its notice period before automated closure' },
              { name: 'maintenance: keep-open',  color: '0e8a16', description: 'Exempt this PR from inactivity-based automated closure' },
              { name: 'close: duplicate',        color: 'd4c5f9', description: 'Maintainer decision: close as duplicate with an automated explanation' },
              { name: 'close: superseded',       color: 'd4c5f9', description: 'Maintainer decision: close because newer work supersedes this PR' },
              { name: 'close: withdrawn',        color: 'd4c5f9', description: 'Close automatically after the author asks to withdraw the PR' },
              { name: 'close: out-of-scope',     color: 'd4c5f9', description: 'Maintainer decision: close because the change is outside repository scope' },
              // ── Discussion-template labels ──
              { name: 'bug',                     color: 'd73a4a', description: 'Bug report (Discussions → Bugs template)' },
              { name: 'idea',                    color: 'a2eeef', description: 'Feature idea / proposal (Discussions → Ideas template)' },
              { name: 'question',                color: 'd876e3', description: 'Authoring or usage question (Discussions → Q&A template)' },
              { name: 'show-and-tell',           color: '0e8a16', description: 'Community demo (Discussions → Show and tell template)' },
              // ── Surface labels (auto-applied to discussions by auto-label-discussions.yml) ──
              { name: 'app',                     color: '5319e7', description: 'Microsoft Discovery app (Windows desktop client)' },
              { name: 'services',                color: '006b75', description: 'Microsoft Discovery services (Azure cloud)' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
                console.log(`Created label: ${label.name}`);
              } catch (err) {
                if (err.status === 422) {
                  // Label already exists — update it
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                  console.log(`Updated label: ${label.name}`);
                } else {
                  throw err;
                }
              }
            }
            console.log('All labels created/updated successfully.');