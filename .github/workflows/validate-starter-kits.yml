name: Validate Starter Kits

# This workflow is a *required* status check on `main`. GitHub treats a
# non-triggered required check as "expected, never reported" which blocks PRs
# that don't touch the trigger paths. The workflow now runs on every PR and a
# "Detect relevant changes" guard step skips the real work (still reporting
# success) when no starter-kit files were touched.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual starter-kit validation"
        required: false
        default: "Manual starter-kit validation"
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate starter kit manifests
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Detect relevant changes
        id: changes
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('relevant', 'true');
              core.setOutput('added-kits', '');
              core.notice('Manual dispatch: validating every starter-kit manifest against the selected ref.');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const schemaPattern = /^docs\/schemas\/(common-schema|starter-kit-schema)\.json$/;
            const relevant = files.some(({ filename }) =>
              filename.startsWith('starter-kits/') || schemaPattern.test(filename)
            );
            const addedKits = files.flatMap(({ filename, status }) => {
              const match = /^starter-kits\/([^/]+)\/kit\.json$/.exec(filename);
              return status === 'added' && match ? [match[1]] : [];
            });
            core.setOutput('relevant', String(relevant));
            core.setOutput('added-kits', [...new Set(addedKits)].join(' '));
            if (!relevant) {
              core.notice('No starter-kits/** or starter-kit-schema.json changes; reporting success without running validation.');
            }

      # Security boundary: the validator is *trusted* code checked out from the
      # PR base and run against the PR's starter-kit manifests as data. The
      # preceding checkouts disable persisted credentials so a PR cannot read
      # the token from .git/config while its content is scanned.
      - name: Checkout trusted base (validator code)
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted

      - name: Checkout PR content as data
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: pr

      - name: Set up Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pr/.github/requirements-ci.txt

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: |
          # Pin CI dependency versions from the trusted base checkout. During
          # the bootstrap window - before this constraints file exists on the
          # base branch - install unpinned rather than reading the untrusted PR
          # copy. This self-heals to the pinned path once the PR merges.
          constraint="trusted/.github/requirements-ci.txt"
          if [ -f "$constraint" ]; then
            python -m pip install -c "$constraint" jsonschema pyyaml referencing
          else
            echo "::notice::trusted constraints file absent on base (bootstrap); installing unpinned"
            python -m pip install jsonschema pyyaml referencing
          fi

      - name: Run validation
        if: steps.changes.outputs.relevant == 'true'
        env:
          ADDED_KITS: ${{ steps.changes.outputs.added-kits }}
        run: |
          args=(--repo-root pr --added-kits)
          if [[ -n "$ADDED_KITS" ]]; then
            read -r -a added_kits <<< "$ADDED_KITS"
            args+=("${added_kits[@]}")
          fi
          python trusted/.github/scripts/validate_starter_kits.py "${args[@]}"