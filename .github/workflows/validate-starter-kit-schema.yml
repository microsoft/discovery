name: Validate Starter Kit Schema

# This workflow is a *required* status check on `main`. GitHub treats a
# non-triggered required check as "expected, never reported" which blocks PRs
# that don't touch the trigger paths. The workflow now runs on every PR and a
# "Detect relevant changes" guard step skips the real work (still reporting
# success) when the starter-kit schemas weren't touched.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-schema:
    name: Schema regression guard (SKS-001 – SKS-003)
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      # NOTE: All PRs in this repo come from forks (including those by maintainers).
      # CODEOWNERS + branch protection are the merge gate; the schema-regression
      # checks below just verify that any proposed schema change doesn't break
      # the existing catalog. It runs under pull_request with read-only permissions
      # and no secrets, so executing the proposed test changes is safe here.

      - name: Detect relevant changes
        id: changes
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const pattern = /^docs\/schemas\/(common-schema|starter-kit-schema|starter-kit-registry-schema)\.json$/;
            const relevant = files.some(({ filename }) => pattern.test(filename));
            core.setOutput('relevant', String(relevant));
            if (!relevant) {
              core.notice('No starter-kit schema files changed; reporting success without running regression guard.');
            }
      - name: Checkout PR branch
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: >
          python -m pip install -c .github/requirements-ci.txt pytest jsonschema pyyaml referencing
      - name: Run SKS-001 through SKS-003 schema checks
        if: steps.changes.outputs.relevant == 'true'
        run: python -m pytest .github/tests/test_schema_security.py -q
