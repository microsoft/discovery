name: Unit Tests

# Runs the .github/tests/ pytest suites: the POL-009 model-weight sniffer, the
# picklescan integration inside validate_pr.py, and the per-rule suites under
# .github/tests/rules/ that cover the modular rule engine.
#
# This workflow is a *required* status check on `main`. GitHub treats a
# non-triggered required check as "expected, never reported" which blocks PRs
# that don't touch the relevant paths. To avoid that, the workflow runs on
# every PR and a "Detect relevant changes" guard step skips the real work
# (but still reports success) when no trusted code, policy, schema, or security
# automation files changed.

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/codeql/**"
      - ".github/dependabot.yml"
      - ".github/requirements-ci.txt"
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/policy/**"
      - ".github/workflows/code-scan.yml"
      - ".github/workflows/dependency-review.yml"
      - ".github/workflows/unit-tests.yml"
      - "docs/schemas/**"
      - "docs/validation-rules.csv"
      - "docs/validation-rules.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pytest:
    name: Run pytest on .github/tests/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Detect relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const patterns = [
              /^\.github\/(scripts|tests|policy|codeql)\//,
              /^\.github\/(dependabot\.yml|requirements-ci\.txt)$/,
              /^\.github\/workflows\/(code-scan|dependency-review|unit-tests)\.yml$/,
              /^docs\/(schemas\/|validation-rules\.(csv|md)$)/,
            ];
            const relevant = files.some(({ filename }) =>
              patterns.some((pattern) => pattern.test(filename))
            );
            core.setOutput('relevant', String(relevant));
            if (!relevant) {
              core.notice('No trusted code, policy, schema, or security automation paths changed; reporting success without running pytest.');
            }

      - name: Checkout
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: python -m pip install -r .github/requirements-ci.txt

      - name: Run unit tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: python -m pytest .github/tests/ -v

      # A rule or policy change can silently start firing on legacy content.
      # This fails when the catalog has violations the ratchet baseline does
      # not already record, forcing an explicit decision instead of a surprise
      # failure on an unrelated contributor's PR.
      - name: Ratchet baseline drift
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: python .github/scripts/generate_baseline.py --check

      - name: Rule documentation drift
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: python .github/scripts/generate_rule_docs.py --check