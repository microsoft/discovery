name: Unit Tests

# Runs the .github/tests/ pytest suites: the POL-009 model-weight sniffer, the
# picklescan integration inside validate_pr.py, and the per-rule suites under
# .github/tests/rules/ that cover the modular rule engine.
#
# This workflow is a *required* status check on `main`. GitHub treats a
# non-triggered required check as "expected, never reported" which blocks PRs
# that don't touch the relevant paths. To avoid that, the workflow runs on
# every PR and a "Detect relevant changes" guard step skips the real work
# (but still reports success) when no scripts/tests/policy/schema/workflow files changed.

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/policy/**"
      - ".github/workflows/unit-tests.yml"
      - "docs/schemas/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pytest:
    name: Run pytest on .github/tests/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Detect relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILES=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          if echo "$FILES" | grep -E '^\.github/(scripts|tests|policy)/|^\.github/workflows/unit-tests\.yml$|^docs/schemas/' >/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No scripts/tests/policy/schema/unit-tests-workflow paths changed; reporting success without running pytest."
          fi

      - name: Checkout
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: pip install --index-url https://packagefeedproxy.microsoft.io/pypi/simple/ pytest jsonschema pyyaml picklescan onnx dnspython==2.8.0 codespell==2.4.1

      - name: Run unit tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: python -m pytest .github/tests/ -v

      # A rule or policy change can silently start firing on legacy content.
      # This fails when the catalog has violations the ratchet baseline does
      # not already record, forcing an explicit decision instead of a surprise
      # failure on an unrelated contributor's PR.
      - name: Ratchet baseline drift
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: python .github/scripts/generate_baseline.py --check

      - name: Rule documentation drift
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: python .github/scripts/generate_rule_docs.py --check