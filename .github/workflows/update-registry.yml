name: Update Registry

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "starter-kits/**"
      - ".github/policy/base-images.yaml"
      - ".github/scripts/compute_tags.py"
      - ".github/scripts/dockerfile_parser.py"
      - ".github/scripts/list_base_images.py"
      - ".github/scripts/rules/base.py"

  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Manual registry refresh"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-registry
  cancel-in-progress: false

jobs:
  update-registry:
    name: Rebuild .auto-registry/*-registry.json
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history needed so the commit author is resolved correctly
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -c .github/requirements-ci.txt pyyaml jsonschema referencing

      - name: Rebuild .auto-registry/agent-registry.json
        run: python .github/scripts/update_registry.py --repo-root . --output .auto-registry/agent-registry.json

      - name: Validate agent-registry.json against registry-schema.json
        run: |
          python -c "
          import json, sys, jsonschema
          from referencing import Registry, Resource
          with open('docs/schemas/common-schema.json') as f:
              common_schema = json.load(f)
          with open('docs/schemas/metadata-schema.json') as f:
              metadata_schema = json.load(f)
          with open('docs/schemas/registry-schema.json') as f:
              schema = json.load(f)
          with open('.auto-registry/agent-registry.json') as f:
              data = json.load(f)
          # registry-schema.json \$refs both common-schema.json and
          # metadata-schema.json (associated_tools); register both so the
          # references resolve instead of raising an unresolvable-reference error.
          schema_registry = Registry().with_resources([
              ('common-schema.json', Resource.from_contents(common_schema)),
              ('metadata-schema.json', Resource.from_contents(metadata_schema)),
          ])
          v = jsonschema.Draft7Validator(
              schema, registry=schema_registry, format_checker=jsonschema.FormatChecker()
          )
          errors = sorted(v.iter_errors(data), key=lambda e: list(e.path))
          if errors:
              for e in errors:
                  path = ' -> '.join(str(p) for p in e.absolute_path) or '(root)'
                  print(f'  FAIL: registry at {path}: {e.message}', file=sys.stderr)
              sys.exit(1)
          print('  OK: agent-registry.json conforms to registry-schema.json')
          "

      # Starter-kit registry depends on the freshly-generated agent-registry
      # (the script reads agent paths from it), so this MUST run after the
      # agent-registry step. If there are no starter-kits in the repo the
      # script produces no output and we just skip validation for that file.
      - name: Rebuild .auto-registry/starter-kit-registry.json
        run: python .github/scripts/update_starter_kits_registry.py --repo-root .

      - name: Validate starter-kit-registry.json against starter-kit-registry-schema.json
        run: |
          python -c "
          import json, sys, os
          try:
              import jsonschema
              from referencing import Registry, Resource
              if not os.path.exists('.auto-registry/starter-kit-registry.json'):
                  print('  SKIP: no starter-kit-registry.json produced (no kits in repo).')
                  sys.exit(0)
              with open('docs/schemas/common-schema.json') as f:
                  common_schema = json.load(f)
              with open('docs/schemas/starter-kit-schema.json') as f:
                  starter_kit_schema = json.load(f)
              with open('docs/schemas/starter-kit-registry-schema.json') as f:
                  schema = json.load(f)
              with open('.auto-registry/starter-kit-registry.json') as f:
                  registry = json.load(f)
              jsonschema.Draft7Validator.check_schema(schema)
              # starter-kit-registry-schema.json \$refs both common-schema.json
              # and starter-kit-schema.json; register both so those references
              # resolve instead of raising an unresolvable-reference error.
              schema_registry = Registry().with_resources([
                  ('common-schema.json', Resource.from_contents(common_schema)),
                  ('starter-kit-schema.json', Resource.from_contents(starter_kit_schema)),
              ])
              validator = jsonschema.Draft7Validator(
                schema, registry=schema_registry, format_checker=jsonschema.FormatChecker()
              )
              errors = sorted(validator.iter_errors(registry), key=lambda e: list(e.absolute_path))
              if errors:
                  for err in errors:
                      path_str = ' -> '.join(str(p) for p in err.absolute_path) or '(root)'
                      print(f'  FAIL at {path_str}: {err.message}', file=sys.stderr)
                  sys.exit(1)
              print(f'  OK: starter-kit-registry.json conforms ({len(registry.get(\"kits\", []))} kit(s)).')
          except json.JSONDecodeError as e:
              print(f'  FAIL: starter-kit-registry.json is not valid JSON: {e}', file=sys.stderr)
              sys.exit(1)
          "

      # Computed tags are derived from agent contents (tools, tests, base
      # images, publisher party), so they belong with the other generated
      # registries: bot-owned, never hand-edited, refreshed on the same push.
      - name: Rebuild .auto-registry/agent-tags.json
        run: python .github/scripts/compute_tags.py --repo-root .

      - name: Check for changes
        id: diff
        run: |
          # `git diff` ignores untracked files, so we must `git add` first
          # otherwise a brand-new .auto-registry/*.json (i.e. the very first
          # time this workflow runs, or after the files are deleted) would
          # be classified as "no change" and never committed.
          git add .auto-registry/agent-registry.json
          if [ -f .auto-registry/starter-kit-registry.json ]; then
            git add .auto-registry/starter-kit-registry.json
          fi
          if [ -f .auto-registry/agent-tags.json ]; then
            git add .auto-registry/agent-tags.json
          fi
          if git diff --cached --quiet -- .auto-registry/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Detect whether the App secrets are configured. GitHub Actions does
      # NOT allow `secrets.X` to be referenced from a step-level `if:`
      # condition (the workflow fails to parse with "Unrecognized named-value:
      # secrets"). Use an intermediate shell step to surface the presence as
      # a step output, then gate subsequent steps on that.
      - name: Check for App secrets
        id: app_check
        if: steps.diff.outputs.changed == 'true'
        env:
          REGISTRY_APP_ID: ${{ secrets.REGISTRY_APP_ID }}
          REGISTRY_APP_PRIVATE_KEY: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${REGISTRY_APP_ID:-}" ] && [ -n "${REGISTRY_APP_PRIVATE_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # Mint a short-lived (~1h) GitHub App installation token. Required
      # because the default GITHUB_TOKEN is read-only. The App
      # (discovery-registry-bot) must have Contents: Write and Pull requests:
      # Write on microsoft/discovery.
      # If REGISTRY_APP_ID is unset (App not yet wired up), this step is
      # skipped and the workflow fails without pushing any branch.
      - name: Generate App installation token
        if: steps.app_check.outputs.configured == 'true'
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.REGISTRY_APP_ID }}
          private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}

      - name: Commit updated registry to a PR
        if: steps.diff.outputs.changed == 'true' && steps.app_check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Each run owns its branch. Normal pushes cannot overwrite a prior
          # run's reviewed content or rewrite an existing PR.
          BRANCH="chore/registry-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"

          # Compose a commit message that reflects what actually changed.
          # Both files are already staged in the previous step. `|| true`
          # inside a subshell so grep exit 1 (no matches) doesn't abort
          # the script under `set -euo pipefail`.
          AGENT_DIFF=$(git diff --cached -- .auto-registry/agent-registry.json || true)
          KIT_DIFF=$(git diff --cached -- .auto-registry/starter-kit-registry.json || true)
          TAGS_DIFF=$(git diff --cached -- .auto-registry/agent-tags.json || true)
          AGENT_ADDED=$(echo "$AGENT_DIFF" | { grep '^\+.*"path"' || true; } | wc -l | tr -d ' ')
          AGENT_REMOVED=$(echo "$AGENT_DIFF" | { grep '^\-.*"path"' || true; } | wc -l | tr -d ' ')
          PARTS=()
          if [ -n "$AGENT_DIFF" ]; then
            PARTS+=("agent-registry +${AGENT_ADDED}/-${AGENT_REMOVED}")
          fi
          if [ -n "$KIT_DIFF" ]; then
            PARTS+=("starter-kit-registry updated")
          fi
          if [ -n "$TAGS_DIFF" ]; then
            PARTS+=("agent-tags updated")
          fi
          # Join PARTS with ", "
          SUMMARY=$(IFS=', '; echo "${PARTS[*]}")
          COMMIT_MSG="chore: update .auto-registry/ ($SUMMARY) [skip ci]"
          git commit -m "$COMMIT_MSG"

          gh auth setup-git
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "$COMMIT_MSG" \
            --body "Automated registry refresh triggered by catalog changes. Generated by the *Update Registry* workflow. A human CODEOWNER must approve this PR before the approval-gated auto-merge workflow can act."

      - name: Report missing App credentials
        if: steps.diff.outputs.changed == 'true' && steps.app_check.outputs.configured != 'true'
        run: |
          echo "::error::Registry output changed, but REGISTRY_APP_ID/REGISTRY_APP_PRIVATE_KEY are not configured. No branch was pushed. Configure the write-scoped registry App and rerun this workflow."
          exit 1