version: 2
updates:
  # Monthly routine maintenance; security updates are not delayed by these
  # schedules, cooldowns, version-only allow rules, or routine PR limits.
  # Review non-security major upgrades deliberately rather than opening them
  # as standalone PRs. Keep automatic rebasing available for security fixes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "automated-dep-update"
    commit-message:
      prefix: "chore(actions)"
    cooldown:
      default-days: 7

  # The root local tool manifest pins Application Inspector for code scanning.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    cooldown:
      default-days: 7
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      nuget-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "automated-dep-update"
    commit-message:
      prefix: "chore(dotnet)"

  # Discover pip manifests repository-wide, including utilities and new roots.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/.github"
      - "**/*"
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    versioning-strategy: "increase-if-necessary"
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      pip-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "automated-dep-update"
    commit-message:
      prefix: "chore(python)"

  # Track base images in catalog tools.
  - package-ecosystem: "docker"
    directories:
      - "/agents/*/tools/*"
    schedule:
      interval: "monthly"
      time: "08:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "automated-dep-update"
    commit-message:
      prefix: "chore(images)"

  # The Supercomputer CLI uses uv and has active security advisories.
  - package-ecosystem: "uv"
    directory: "/utilities/supercomputer-cli/discovery"
    schedule:
      interval: "monthly"
      time: "08:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      uv-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "automated-dep-update"
    commit-message:
      prefix: "chore(uv)"
