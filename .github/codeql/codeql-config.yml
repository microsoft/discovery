# CodeQL configuration — Discovery catalog
#
# Scoped deliberately. This repository's threat surface is the code that public
# contributors add under agents/, starter-kits/, and skills/, which can run in
# container images or a user's skill-enabled environment. Maintainer-owned
# tooling under .github/ and utilities/ is reviewed through a different path and
# would only add noise here.

name: "Discovery catalog"

paths:
  - agents
  - starter-kits
  - skills

paths-ignore:
  # Scratch directories are local deployer artifacts (POL-012).
  - "agents/tmp/**"
  - "starter-kits/tmp/**"

queries:
  - uses: security-and-quality
